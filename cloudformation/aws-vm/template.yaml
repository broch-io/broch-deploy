AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Deploy Broch on an EC2 instance with identity provider sign-in. Start with your
  domain and master key. The default options create Route 53 DNS records and an
  Amazon RDS PostgreSQL database. To use other DNS or database options, change
  the choices below and complete their matching sections. CloudFormation shows
  every section even when it does not apply; leave unused sections at their
  defaults. The stack completes when Broch is healthy.
#
# NOTE: the canonical assets (docker-compose.yml, BOTH Caddyfiles, the four
# per-provider caddy-tls fragments, and the pinned Amazon RDS CA bundle the
# database connection verifies against) are base64-embedded by build.sh — this
# committed template carries __*_B64__ placeholders for all of them
# (Auto = ACME DNS-01 Caddyfile, Byo = static-cert Caddyfile; CertMode picks one
# at deploy, DnsProvider picks the tls fragment at boot). Deploy the built
# output (dist/template.yaml), never this file directly. See README.md.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label: { default: "Start here - domain and encryption" }
        Parameters: [DnsZone, ShareSubdomain, BrochMasterKey]
      - Label: { default: "DNS and HTTPS - choose how they work" }
        Parameters: [DnsProvider, DnsAutoRecords, CertMode, AcmeEmail]
      - Label: { default: "Route 53 - fill in if you selected Route 53" }
        Parameters: [HostedZoneId]
      - Label: { default: "Cloudflare - only if you selected Cloudflare" }
        Parameters: [CloudflareApiToken]
      - Label: { default: "Google Cloud DNS - only if you selected Google Cloud DNS" }
        Parameters: [GcpProject, GcpCredentialsJson]
      - Label: { default: "DigitalOcean - only if you selected DigitalOcean" }
        Parameters: [DoAuthToken]
      - Label: { default: "Delegated DNS zone - advanced" }
        Parameters: [DnsZoneName]
      - Label: { default: "Your own HTTPS certificate - only for Byo mode" }
        Parameters: [TlsCertificate, TlsCertificateKey]
      - Label: { default: "Database - choose one mode" }
        Parameters: [DatabaseMode]
      - Label: { default: "New RDS database - only for NewServer mode" }
        Parameters: [DbSubnetIds, DbInstanceClass, DbAllocatedStorage]
      - Label: { default: "Existing database - only for ExistingDatabase mode" }
        Parameters: [DatabaseConnectionString]
      - Label: { default: "Existing PostgreSQL server - only for ExistingServer mode" }
        Parameters: [DbServerHost, DbServerPort, DbAdminUsername, DbAdminPassword, DbServerSecurityGroupId, DbSslMode]
      - Label: { default: "PostgreSQL on this instance - only for Local mode" }
        Parameters: [LocalDbAdminPassword, DataVolumeSize, DataVolumeAz, DataVolumeSnapshotId]
      - Label: { default: "Identity provider - use the selected template" }
        Parameters: [AuthProvider, AuthClientId, AuthClientSecret, AuthAdminRoles, AuthDomain, AuthTenantId, AuthInstance, AuthAuthority, AuthAudience]
      - Label: { default: "AWS network and instance" }
        Parameters: [VpcId, InstanceSubnetId, InstanceType, SshAllowedCidr]
      - Label: { default: "Existing Elastic IP - optional" }
        Parameters: [ElasticIpAllocationId, ElasticIpAddress]
      - Label: { default: "Image and version - advanced" }
        Parameters: [BrochVersion, BrochImage, UbuntuAmi, RegistryServer, RegistryUsername, RegistryPassword]
    ParameterLabels:
      DnsZone: { default: "Domain for Broch (example.com)" }
      ShareSubdomain: { default: "Broch subdomain (default: broch)" }
      BrochMasterKey: { default: "Broch master key (required)" }
      DnsProvider: { default: "Who manages DNS for your domain?" }
      DnsAutoRecords: { default: "Create DNS records automatically?" }
      CertMode: { default: "How should Broch get its HTTPS certificate?" }
      AcmeEmail: { default: "Let's Encrypt email (required)" }
      HostedZoneId: { default: "Route 53 hosted zone ID" }
      DnsZoneName: { default: "Delegated DNS zone (advanced; usually blank)" }
      CloudflareApiToken: { default: "Cloudflare API token" }
      DoAuthToken: { default: "DigitalOcean API token" }
      GcpProject: { default: "Google Cloud project ID" }
      GcpCredentialsJson: { default: "Google Cloud DNS service account key (base64)" }
      TlsCertificate: { default: "HTTPS certificate chain (base64)" }
      TlsCertificateKey: { default: "HTTPS private key (base64)" }
      DatabaseMode: { default: "Where should PostgreSQL run?" }
      DbSubnetIds: { default: "RDS subnets in two or more Availability Zones" }
      DbInstanceClass: { default: "RDS instance size" }
      DbAllocatedStorage: { default: "RDS storage (GB)" }
      DatabaseConnectionString: { default: "Existing database connection string" }
      DbServerHost: { default: "Existing PostgreSQL server hostname" }
      DbServerPort: { default: "Existing PostgreSQL server port" }
      DbAdminUsername: { default: "Existing server administrator username" }
      DbAdminPassword: { default: "Existing server administrator password" }
      DbServerSecurityGroupId: { default: "Existing server security group ID" }
      DbSslMode: { default: "How to verify the existing server certificate" }
      LocalDbAdminPassword: { default: "Local database password (blank to generate)" }
      DataVolumeSize: { default: "Local database volume size (GiB)" }
      DataVolumeAz: { default: "Local database Availability Zone" }
      DataVolumeSnapshotId: { default: "Restore local database from snapshot (optional)" }
      AuthProvider: { default: "Identity provider" }
      AuthClientId: { default: "Application (client) ID" }
      AuthClientSecret: { default: "Application client secret (required)" }
      AuthAdminRoles: { default: "Roles allowed to administer Broch" }
      AuthDomain: { default: "Identity provider tenant domain" }
      AuthTenantId: { default: "Microsoft Entra tenant ID" }
      AuthInstance: { default: "Microsoft Entra sign-in URL" }
      AuthAuthority: { default: "OpenID Connect issuer URL" }
      AuthAudience: { default: "Auth0 API audience (required for Auth0)" }
      VpcId: { default: "VPC for Broch" }
      InstanceSubnetId: { default: "Public subnet for the EC2 instance" }
      InstanceType: { default: "EC2 instance size" }
      SshAllowedCidr: { default: "Allow SSH from this CIDR (optional)" }
      ElasticIpAllocationId: { default: "Existing Elastic IP allocation ID" }
      ElasticIpAddress: { default: "Existing Elastic IP address" }
      BrochVersion: { default: "Broch version" }
      BrochImage: { default: "Broch container image" }
      UbuntuAmi: { default: "Ubuntu AMI parameter (advanced)" }
      RegistryServer: { default: "Container registry host" }
      RegistryUsername: { default: "Container registry username" }
      RegistryPassword: { default: "Container registry token" }

Parameters:
  # ── Encryption (required) ────────────────────────────────────────────────────
  BrochMasterKey:
    Type: String
    NoEcho: true
    MinLength: 32
    Description: >-
      Required. Generate once with openssl rand -base64 48 and save the value securely.
      Reuse the same key whenever you redeploy with an existing Broch database; a new key
      cannot decrypt its data. This stack stores the key in Secrets Manager in your AWS account.
    AllowedPattern: "^$|^[^'\\r\\n]*[^'\\r\\n\\\\]$"
    ConstraintDescription: must not contain a single quote or a line break, or end with a backslash.

  # ── Domain & TLS ────────────────────────────────────────────────────────────
  # The public hostname is COMPOSED from DnsZone + ShareSubdomain (Broch serves
  # <ShareSubdomain>.<DnsZone> and *.<ShareSubdomain>.<DnsZone>), so the share host is always
  # within the zone by construction -- there is no separate full-hostname parameter that could
  # disagree with the zone.
  DnsZone:
    Type: String
    Description: Enter the domain you own, such as example.com. Put broch in the subdomain field, not here. The default public hostname is broch.example.com.
    AllowedPattern: "^(?!-)[A-Za-z0-9-]{1,63}(?<!-)(\\.(?!-)[A-Za-z0-9-]{1,63}(?<!-))+$"
    ConstraintDescription: must be a valid domain name, e.g. example.com.
  ShareSubdomain:
    Type: String
    Default: broch
    Description: Leave broch for broch.example.com and *.broch.example.com. Leave blank to use example.com and *.example.com instead. Replace example.com with your domain.
    # Empty (apex) or a DNS subdomain of one or more labels. render-secrets.sh interpolates this into
    # a single-quoted shell literal inside Fn::Sub, so the hostname charset excludes both the '$'
    # (CFn-var) and "'" (quoting) hazards.
    AllowedPattern: "^$|^(?!-)[A-Za-z0-9-]{1,63}(?<!-)(\\.(?!-)[A-Za-z0-9-]{1,63}(?<!-))*$"
    ConstraintDescription: must be empty (apex) or a DNS subdomain using letters, digits, dots, and hyphens only.
  DnsZoneName:
    # Advanced. The zone that auto-DNS WRITES the apex/wildcard A records into, for the DELEGATED case
    # where the DNS zone that owns the records is a subdomain of DnsZone (e.g. DnsZone=example.com for
    # the URLs, but share.example.com is its own delegated zone). Empty (the common case) makes the
    # render fall back to DnsZone, so existing deploys are unchanged. Only the token-provider
    # (Cloudflare/GoogleCloudDns/DigitalOcean) caddy-dynamicdns path reads this; the Route53 native
    # RecordSet path resolves its zone from HostedZoneId and ignores it. render-secrets.sh interpolates
    # this into a single-quoted shell literal inside Fn::Sub, so the same "$"- and "'"-free charset as
    # DnsZone/ShareSubdomain applies (the AllowedPattern enforces it).
    Type: String
    Default: ""
    Description: Advanced. Leave blank unless your selected non-Route 53 provider manages Broch records in a delegated DNS zone that differs from the domain above. Route 53 ignores this field.
    AllowedPattern: "^$|^(?!-)[A-Za-z0-9-]{1,63}(?<!-)(\\.(?!-)[A-Za-z0-9-]{1,63}(?<!-))+$"
    ConstraintDescription: must be empty or a valid domain name, e.g. share.example.com.
  HostedZoneId:
    # Plain String (not AWS::Route53::HostedZone::Id) so it can be empty for the non-Route53
    # providers -- an AWS-specific type validates the "" default unconditionally and would break
    # them. Required only for DnsProvider=Route53 (enforced by the Route53RequiresHostedZone Rule).
    Type: String
    Default: ""
    Description: Required when DNS provider is Route 53. In the Route 53 console, open the hosted zone for your domain and copy its hosted zone ID. Leave blank for other providers.
  CertMode:
    Type: String
    AllowedValues: [Auto, Byo]
    Default: Auto
    Description: Auto (default) obtains and renews HTTPS certificates using the DNS provider you selected. Byo (bring your own) uses the certificate and private key you enter below; you renew them yourself.
  TlsCertificate:
    Type: String
    NoEcho: true
    Default: ""
    Description: >-
      Only for Byo certificate mode. Enter the base64-encoded PEM full chain, for example
      base64 -w0 fullchain.pem. The certificate must cover both your Broch hostname and its
      wildcard; a wildcard alone does not cover the hostname used by the admin console.
  TlsCertificateKey:
    Type: String
    NoEcho: true
    Default: ""
    Description: Only for Byo certificate mode. Enter the base64-encoded PEM private key, for example base64 -w0 privkey.pem.
  AcmeEmail:
    Type: String
    Description: Required in every certificate mode. Contact email for the Let's Encrypt account that issues and renews your certificates (unused when you bring your own certificate).
    # Required, no Default, in EVERY CertMode: with Auto, Caddy refuses to start with an empty
    # email (no TLS, no automatic DNS records); in every mode -- Byo included, where the value is
    # otherwise unused -- the shared compose file refuses to start while it is blank. So a blank
    # value must fail stack creation here, not boot an unreachable instance. Do not scope this to
    # Auto with a Rules entry.
    # Written single-quoted to /opt/broch/.env, so a single quote or a backslash is refused (Fn::Sub
    # never re-reads a substituted value, so "$" itself would be harmless; it isn't valid here anyway).
    AllowedPattern: "^[^$\\s@'\\\\]+@[^$\\s@'\\\\]+\\.[^$\\s@'\\\\]+$"
    ConstraintDescription: must be an email address (name@example.com) with no '$', single quote or backslash.
  DnsProvider:
    Type: String
    AllowedValues: [Route53, Cloudflare, GoogleCloudDns, DigitalOcean]
    Default: Route53
    Description: Select the service that manages your domain. Route53 is the default and always needs a hosted zone ID below. For automatic certificates, other providers need credentials in their sections. With Byo certificates, DNS records are manual and provider credentials are not needed.
  DnsAutoRecords:
    Type: String
    AllowedValues: [Auto, Manual]
    Default: Auto
    Description: Auto (default) creates the Broch hostname and wildcard A records. Choose Manual if you will manage those records yourself, including when a load balancer or proxy sits in front of Broch. Byo certificate mode always uses manual DNS records.
  CloudflareApiToken:
    Type: String
    NoEcho: true
    Default: ""
    Description: Only when DNS provider is Cloudflare. Create a token with Zone Read and DNS Edit access to your zone.
    AllowedPattern: "^$|^[^'\\r\\n]*[^'\\r\\n\\\\]$"
    ConstraintDescription: must not contain a single quote or a line break, or end with a backslash.
  DoAuthToken:
    Type: String
    NoEcho: true
    Default: ""
    Description: Only when DNS provider is DigitalOcean. Enter an API token that can edit DNS records for your domain.
    AllowedPattern: "^$|^[^'\\r\\n]*[^'\\r\\n\\\\]$"
    ConstraintDescription: must not contain a single quote or a line break, or end with a backslash.
  GcpProject:
    Type: String
    Default: ""
    Description: Only when DNS provider is Google Cloud DNS. Enter the project ID that contains your managed zone.
    AllowedPattern: "^$|^[^'\\r\\n]*[^'\\r\\n\\\\]$"
    ConstraintDescription: must not contain a single quote or a line break, or end with a backslash.
  GcpCredentialsJson:
    Type: String
    NoEcho: true
    Default: ""
    Description: Only when DNS provider is Google Cloud DNS. Enter a base64-encoded service account JSON key with DNS Admin access, for example base64 -w0 sa.json.

  # ── Database ────────────────────────────────────────────────────────────────
  DatabaseMode:
    Type: String
    AllowedValues: [NewServer, ExistingDatabase, ExistingServer, Local]
    Default: NewServer
    Description: >-
      NewServer (default) creates a private Amazon RDS database with managed backups.
      ExistingDatabase connects with a connection string you provide. ExistingServer
      creates a Broch database on a PostgreSQL server you already run. Local runs
      PostgreSQL on this EC2 instance; you must manage backups with EBS snapshots.
  # ── Local (on-box Postgres) database mode ─────────────────────────────────────
  # Local runs the bundled Postgres on a dedicated EBS gp3 volume mounted at the Docker named-volumes
  # path (/var/lib/docker/volumes) BEFORE Docker installs, so the postgres_data named volume lives on
  # it and is preserved across instance stop/start + a stack-delete snapshot. Mirrors bicep/azure-vm's databaseMode=Local (dedicated data
  # disk). AWS-specific: the volume is created in DataVolumeAz (the instance's AZ — a Subnet parameter's
  # AZ is not derivable in pure CFN, so it is a required input in Local mode) and attached AT LAUNCH via
  # the instance's Volumes property (a separate VolumeAttachment would deadlock against the instance's
  # CreationPolicy health-signal). The nitro NVMe device is resolved by volume-id, never a hardcoded name.
  LocalDbAdminPassword:
    Type: String
    NoEcho: true
    Default: ""
    Description: >-
      Only for Local mode. Leave blank to generate a password in Secrets Manager.
      If you restore a database snapshot in a new stack, enter the same password that
      initialized that database; a new password cannot open it. Use 8-128 letters,
      digits, or . _ ~ - characters if you supply one.
    AllowedPattern: "^$|^[A-Za-z0-9._~-]{8,128}$"
    ConstraintDescription: >-
      empty (generate one) or 8-128 chars of letters, digits, and . _ ~ - only -- no ; = ' " or
      spaces, which would corrupt the Postgres connection string this value is spliced into.
  DataVolumeSize:
    Type: Number
    Default: 20
    MinValue: 4
    MaxValue: 1024
    Description: >-
      Only for Local mode. Size of the EBS volume holding PostgreSQL data; 20 GiB
      is the default. If you increase it after deployment, also grow its filesystem.
  DataVolumeAz:
    Type: String
    Default: ""
    Description: >-
      Required only for Local mode. Enter the Availability Zone of the public
      instance subnet you select below, such as us-east-1a. The data volume must
      be in the same zone as the EC2 instance.
    AllowedPattern: "^$|^[a-z]{2}(-[a-z]+)+-[0-9][a-z]$"
    ConstraintDescription: must be empty or an AZ id like us-east-1a (or us-gov-west-1a).
  DataVolumeSnapshotId:
    Type: String
    Default: ""
    Description: >-
      Only for a new Local mode stack that restores an existing EBS snapshot.
      Leave blank for a new database. Use the original database password, Broch
      master key, and Broch version. Do not change this field on a stack update.
    AllowedPattern: "^$|^snap-[0-9a-f]{8,17}$"
    ConstraintDescription: must be empty or an EBS snapshot id like snap-0123456789abcdef0.
  DatabaseConnectionString:
    Type: String
    NoEcho: true
    Default: ""
    Description: >-
      Only for ExistingDatabase mode. Enter a complete Npgsql connection string
      for a ready Broch database. Use SSL Mode=VerifyFull to check the server
      certificate and hostname. For RDS or Aurora, add the bundled RDS CA at
      /etc/broch/db-ca/rds-global-bundle.pem as Root Certificate. No single quote anywhere in it:
      quote a password with double quotes (Password="a;b"). See the README for examples.
    AllowedPattern: "^$|^[^'\\r\\n]*[^'\\r\\n\\\\]$"
    ConstraintDescription: must not contain a single quote or a line break, or end with a backslash.
  DbInstanceClass:
    Type: String
    Default: db.t4g.micro
    # A pattern, not a list: any RDS PostgreSQL class that supports gp3 works, and a closed list
    # would fail the next update of a stack running on a class outside it.
    AllowedPattern: "^db\\.[a-z0-9]+\\.[a-z0-9]+$"
    ConstraintDescription: must be an RDS instance class, such as db.t4g.micro.
    Description: >-
      Only for NewServer mode. Enter the size of the new RDS PostgreSQL instance, such as
      db.t4g.micro (the default), db.t4g.small, db.t4g.medium, db.t3.micro, db.t3.small or
      db.m7g.large. If stack creation fails because RDS has no capacity for this size, delete the
      failed stack and choose another size (or add subnets in more Availability Zones).
  DbAllocatedStorage:
    Type: Number
    Default: 20
    MinValue: 20
    Description: Only for NewServer mode. Storage allocated to the new RDS database in GB.
  DbSubnetIds:
    # CommaDelimitedList, NOT List<AWS::EC2::Subnet::Id>: CloudFormation validates
    # AWS-specific list types UNCONDITIONALLY at stack creation, before evaluating
    # Conditions — so a List<...Subnet::Id> with Default "" fails parameter validation
    # on every ExistingDatabase deploy (where subnets are never used). A basic
    # CommaDelimitedList accepts an empty default and is only dereferenced under IsNewServer.
    Type: CommaDelimitedList
    Default: ""
    Description: Required only for NewServer mode. Enter at least two subnet IDs in different Availability Zones, separated by commas (three or more Availability Zones make an RDS capacity shortage less likely). Choose subnets in the same VPC as the EC2 instance. Leave blank for other database modes.
  # ExistingServer mode: connect to a Postgres server you already run and carve a brochdb +
  # least-priv broch role onto it (at boot, via the admin creds below). Host/username are
  # Fn::Sub'd into render-secrets.sh's shell commands (double-quoted, so no "$"), and the host also
  # into the single-quoted .env connection string, so it is a hostname; the admin password is a secret.
  DbServerHost:
    Type: String
    Default: ""
    Description: Only for ExistingServer mode. Enter the PostgreSQL server endpoint, such as mydb.abc123.us-east-1.rds.amazonaws.com. Use the hostname on its TLS certificate.
    AllowedPattern: "^$|^[A-Za-z0-9.:-]+$"
    ConstraintDescription: must be a hostname or IP address.
  DbServerPort:
    Type: Number
    Default: 5432
    Description: Only for ExistingServer mode. PostgreSQL port, normally 5432.
  DbAdminUsername:
    Type: String
    Default: ""
    Description: Only for ExistingServer mode. Enter a user that can create a database and role. Broch uses it once during setup; it is not kept in the running application configuration.
    AllowedPattern: "^[^$]*$"
    ConstraintDescription: must not contain a '$' character.
  DbAdminPassword:
    Type: String
    NoEcho: true
    Default: ""
    Description: Only for ExistingServer mode. Password for the administrator above; stored in Secrets Manager for first-boot setup.
  DbServerSecurityGroupId:
    # Plain String (not AWS::EC2::SecurityGroup::Id) for the same reason as DbSubnetIds:
    # AWS-specific types validate the "" default unconditionally, breaking non-ExistingServer deploys.
    Type: String
    Default: ""
    Description: Only for ExistingServer mode. The database security group ID. This stack adds a rule allowing PostgreSQL traffic from the Broch instance.
  DbSslMode:
    # Governs BOTH the one-time admin carve (psql) and broch's own connection string. There is no
    # plaintext/no-TLS option on purpose: the carve sends the server's admin password over this link.
    # VerifyFull stays the default (the RDS bundle); VerifyFullSystemCa uses the OS store; Require is
    # the encrypt-only last resort. A verify-ca (chain but no hostname) mode is deliberately absent:
    # it would accept any certificate from the same CA, i.e. any other RDS instance.
    Type: String
    AllowedValues: [VerifyFull, VerifyFullSystemCa, Require]
    Default: VerifyFull
    Description: >-
      Only for ExistingServer mode. VerifyFull (default) checks the hostname
      and the Amazon RDS certificate chain. Use VerifyFullSystemCa when the
      server certificate comes from a public CA, including RDS Proxy. Require
      encrypts traffic but does not verify the server; use it only if neither
      verified mode works. See the template README for details.

  # ── Identity provider (boot floor) ──────────────────────────────────────────
  # The free-text auth fields below are templated into /opt/broch/.env via Fn::Sub, single-quoted,
  # so docker compose takes them literally; their AllowedPattern refuses only what single quotes
  # can't carry (a quote, a line break, a trailing backslash). AuthClientSecret is fetched from
  # Secrets Manager at boot and written single-quoted too, so it carries the same pattern.
  AuthProvider:
    Type: String
    Default: ""
    Description: Published launch links fix this value. If you built your own template, choose the provider configured for your app. Broch has no local login.
    # Exact spellings: the per-provider Rules below compare case-sensitively while Broch binds the
    # provider case-insensitively, so "auth0" would boot as Auth0 having skipped the Auth0 Rules.
    AllowedValues: ["", AzureAd, EntraExternalId, Auth0, Okta, Oidc]
    AllowedPattern: "^[^$]*$"
    ConstraintDescription: must not contain a '$' character.
  AuthClientId:
    Type: String
    Default: ""
    Description: Required. Copy the application or client ID from the identity provider app you created for Broch.
    AllowedPattern: "^$|^[^'\\r\\n]*[^'\\r\\n\\\\]$"
    ConstraintDescription: must not contain a single quote or a line break, or end with a backslash.
  AuthClientSecret:
    Type: String
    NoEcho: true
    Default: ""
    Description: Required. Create a confidential client in your identity provider and enter its client secret. Broch needs it for server-side sign-in. The stack stores it in your AWS Secrets Manager.
    AllowedPattern: "^$|^[^'\\r\\n]*[^'\\r\\n\\\\]$"
    ConstraintDescription: must not contain a single quote or a line break, or end with a backslash.
  AuthAdminRoles:
    Type: String
    Default: broch_admin
    Description: Comma-separated identity provider role names that can administer Broch. Default is broch_admin; assign that role to your first administrator.
    AllowedPattern: "^$|^[^'\\r\\n]*[^'\\r\\n\\\\]$"
    ConstraintDescription: must not contain a single quote or a line break, or end with a backslash.
  AuthDomain: { Type: String, Default: "", Description: "Required for Auth0 or Okta. Enter your tenant domain, such as tenant.auth0.com; omit https://.", AllowedPattern: "^$|^[^'\\r\\n]*[^'\\r\\n\\\\]$", ConstraintDescription: "must not contain a single quote or a line break, or end with a backslash." }
  AuthTenantId: { Type: String, Default: "", Description: "Required for Microsoft Entra ID. Copy the Directory (tenant) ID from your app registration.", AllowedPattern: "^$|^[^'\\r\\n]*[^'\\r\\n\\\\]$", ConstraintDescription: "must not contain a single quote or a line break, or end with a backslash." }
  AuthInstance: { Type: String, Default: "", Description: "Required for Microsoft Entra ID: https://login.microsoftonline.com/ for AzureAd, https://<tenant>.ciamlogin.com/ for EntraExternalId.", AllowedPattern: "^$|^[^'\\r\\n]*[^'\\r\\n\\\\]$", ConstraintDescription: "must not contain a single quote or a line break, or end with a backslash." }
  AuthAuthority: { Type: String, Default: "", Description: "Required for OpenID Connect. Enter the full HTTPS issuer URL published by your provider.", AllowedPattern: "^$|^[^'\\r\\n]*[^'\\r\\n\\\\]$", ConstraintDescription: "must not contain a single quote or a line break, or end with a backslash." }
  AuthAudience: { Type: String, Default: "", Description: "Required for Auth0: the Identifier of the Auth0 API your Broch application has user access to (Applications > APIs). Ignored by other providers.", MaxLength: 500, AllowedPattern: "^[^'\\s\\\\]*$", ConstraintDescription: "must not contain whitespace, a single quote or a backslash, and must be at most 500 characters." }

  # ── Compute & network ───────────────────────────────────────────────────────
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: Choose the VPC for Broch and its database. The default VPC works for a first deployment.
  InstanceSubnetId:
    Type: AWS::EC2::Subnet::Id
    Description: Choose a public subnet in the VPC above. It needs internet access and automatic public IPv4 assignment so the instance can finish first boot.
  # Bring your own Elastic IP: its address is known BEFORE the deploy, so a database outside this VPC
  # can allow-list it in advance. First boot waits for CloudFormation to attach it before any database traffic.
  ElasticIpAllocationId:
    Type: String
    Default: ""
    Description: >-
      Leave blank to allocate a new Elastic IP. To use an address you already own,
      enter its allocation ID and its public IPv4 address below. The address must
      be unassociated. Use this when an external database must allow-list your IP
      before deployment. Do not change it on a stack update.
    AllowedPattern: "^$|^eipalloc-[0-9a-f]{8,17}$"
    ConstraintDescription: must be empty or an allocation id like eipalloc-0123456789abcdef0.
  ElasticIpAddress:
    Type: String
    Default: ""
    Description: >-
      Public IPv4 address for the allocation ID above. Enter both fields for an
      existing Elastic IP, or leave both blank to create one with the stack.
    AllowedPattern: "^$|^((25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])\\.){3}(25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])$"
    ConstraintDescription: must be empty or an IPv4 address like 203.0.113.10.
  InstanceType:
    Type: String
    Default: t4g.small
    Description: EC2 instance size. The default t4g.small is an ARM64 Graviton instance.
  UbuntuAmi:
    # Pinned to one Canonical release serial, NOT the stable/current alias (deploy-lint rejects
    # /current/). CloudFormation re-resolves an SSM-typed parameter on EVERY stack update, so "current"
    # hands the Instance a new ImageId whenever Canonical publishes (every few weeks) and any update --
    # even a one-parameter change -- REPLACES the instance (and in Local mode rolls back: the new
    # instance cannot attach the data volume the old one holds). A serial path keeps resolving to the
    # same AMI, so updates keep the instance. Canonical still publishes every serial back to 2024
    # (checked 2026-09-26); if one were withdrawn, updates would fail until UbuntuAmi moves to a newer
    # serial (a replacement). Bump the serial in a template release; the running box patches itself
    # via unattended-upgrades in between. x86: the same path with amd64 in place of arm64.
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/canonical/ubuntu/server/24.04/stable/20260923/arm64/hvm/ebs-gp3/ami-id
    Description: >-
      Advanced. Leave the default Ubuntu 24.04 image unless you need another
      architecture. The AMI must match the EC2 instance type. Changing this
      field replaces the instance; replacement is unsupported in Local database mode.
  SshAllowedCidr:
    Type: String
    Default: ""
    Description: Leave blank to keep SSH closed and use AWS Systems Manager Session Manager. To allow SSH, enter a trusted CIDR such as 203.0.113.10/32.

  # ── Image (advanced) ────────────────────────────────────────────────────────
  BrochVersion:
    Type: String
    Default: "1.35.0"
    # A Docker tag: spliced into a sed replacement in set-version.sh, so no | or spaces.
    AllowedPattern: "^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$"
    ConstraintDescription: must be a Docker image tag (letters, digits, _ . -), e.g. 1.31.0 or latest.
    Description: >-
      Leave the pinned default for a new deployment. When redeploying with an
      existing database, enter the version that database currently runs; a newer
      version can migrate it. To upgrade later, update this stack with a newer tag.
  BrochImage:
    Type: String
    Default: ghcr.io/broch-io/broch
    Description: Advanced. Leave the default public Broch image unless you use a private build.
  RegistryServer: { Type: String, Default: ghcr.io, Description: "Only for a private Broch image. Container registry hostname." }
  RegistryUsername: { Type: String, Default: broch-io, Description: "Only for a private Broch image. Container registry username." }
  RegistryPassword:
    Type: String
    NoEcho: true
    Default: ""
    Description: Only for a private Broch image. Enter the container registry token; leave blank for the public image.

Conditions:
  IsNewServer: !Equals [!Ref DatabaseMode, NewServer]
  IsExistingDatabase: !Equals [!Ref DatabaseMode, ExistingDatabase]
  IsExistingServer: !Equals [!Ref DatabaseMode, ExistingServer]
  # Local (on-box Postgres): gates the dedicated EBS data volume, its at-launch attachment, and the
  # on-box Postgres password secret. Local requires NONE of the RDS / connection-string / existing-server
  # params, so no Rule asserts them for it (it simply matches none of the mode-keyed Rules below).
  IsLocal: !Equals [!Ref DatabaseMode, Local]
  # Empty LocalDbAdminPassword => generate the on-box Postgres password; set => use the supplied value.
  HasLocalDbPassword: !Not [!Equals [!Ref LocalDbAdminPassword, ""]]
  HasDataVolumeSnapshot: !Not [!Equals [!Ref DataVolumeSnapshotId, ""]]
  CreateElasticIp: !Equals [!Ref ElasticIpAllocationId, ""]
  IsByoCert: !Equals [!Ref CertMode, Byo]
  # The public host is <ShareSubdomain>.<DnsZone>, or the zone apex when ShareSubdomain is empty.
  HasShareSubdomain: !Not [!Equals [!Ref ShareSubdomain, ""]]
  # Route 53 is the only provider the STACK manages DNS resources for (native apex/wildcard
  # RecordSets and the instance-role DNS-01 policy). The token-based providers run on a domain
  # hosted OFF Route 53, so those resources are skipped; their A records come from caddy-dynamicdns
  # on the instance (DnsAutoRecords=Auto with CertMode=Auto) or from the customer (Manual / Byo).
  IsRoute53: !Equals [!Ref DnsProvider, Route53]
  # The native apex/wildcard A records are created only when Route 53 owns the domain, the operator
  # wants the appliance to manage records (DnsAutoRecords=Auto), AND this is not a Byo-cert deploy.
  # DnsAutoRecords=Manual skips them so the operator owns the records -- required when an ALB /
  # reverse proxy / NAT fronts the instance (clients must resolve to that front-end, not the Elastic
  # IP). CertMode=Byo forces Manual for EVERY provider (matching the bicep sibling's effectiveDnsAuto
  # and render-secrets.sh's CertMode!=Byo guard on the token path), so a Byo customer is never
  # surprised by auto-created records. This does NOT gate the DNS-01 IAM policy above: cert issuance
  # needs the role whether records are auto or manual.
  IsRoute53AutoRecords: !And
    - !Equals [!Ref DnsProvider, Route53]
    - !Equals [!Ref DnsAutoRecords, Auto]
    - !Not [!Equals [!Ref CertMode, Byo]]
  # UseGoogleDns gates the GcpCredsPath .env value. The other providers are selected at
  # boot by render-secrets.sh switching on ${DnsProvider}, so they need no Condition here.
  UseGoogleDns: !Equals [!Ref DnsProvider, GoogleCloudDns]
  HasSsh: !Not [!Equals [!Ref SshAllowedCidr, ""]]
  # Each user-supplied secret is stashed in Secrets Manager (and read at boot) only
  # when actually provided — so it never has to ride along in UserData.
  HasCloudflareToken: !Not [!Equals [!Ref CloudflareApiToken, ""]]
  HasDoToken: !Not [!Equals [!Ref DoAuthToken, ""]]
  HasGcpCreds: !Not [!Equals [!Ref GcpCredentialsJson, ""]]
  # Always true for a stack that passes AuthRequiresClientCredentials; kept as a fail-safe guard.
  HasAuthClientSecret: !Not [!Equals [!Ref AuthClientSecret, ""]]
  HasRegistryPassword: !Not [!Equals [!Ref RegistryPassword, ""]]

# Fail fast at stack create/update (before any resource is built) on required
# identity, DNS, database, and certificate inputs.
Rules:
  AuthRequiresClientCredentials:
    Assertions:
      - Assert: !Not [!Equals [!Ref AuthProvider, ""]]
        AssertDescription: AuthProvider is required - Broch has no local login.
      - Assert: !Not [!Equals [!Ref AuthClientId, ""]]
        AssertDescription: AuthClientId is required for every identity provider.
      - Assert: !Not [!Equals [!Ref AuthClientSecret, ""]]
        AssertDescription: AuthClientSecret is required for Broch's server-side sign-in.
  AuthAzureAdRequiresTenant:
    RuleCondition: !Or [!Equals [!Ref AuthProvider, AzureAd], !Equals [!Ref AuthProvider, EntraExternalId]]
    Assertions:
      - Assert: !And [!Not [!Equals [!Ref AuthTenantId, ""]], !Not [!Equals [!Ref AuthInstance, ""]]]
        AssertDescription: AuthTenantId and AuthInstance are required for AzureAd and EntraExternalId.
  AuthDomainProviderRequiresDomain:
    RuleCondition: !Or [!Equals [!Ref AuthProvider, Auth0], !Equals [!Ref AuthProvider, Okta]]
    Assertions:
      - Assert: !Not [!Equals [!Ref AuthDomain, ""]]
        AssertDescription: AuthDomain is required for Auth0 and Okta.
  AuthAuth0RequiresAudience:
    RuleCondition: !Equals [!Ref AuthProvider, Auth0]
    Assertions:
      - Assert: !Not [!Equals [!Ref AuthAudience, ""]]
        AssertDescription: AuthAudience is required for Auth0 - the Identifier of the Auth0 API your Broch application has user access to. Broch refuses to start as Auth0 without it.
  AuthOidcRequiresAuthority:
    RuleCondition: !Equals [!Ref AuthProvider, Oidc]
    Assertions:
      - Assert: !Not [!Equals [!Ref AuthAuthority, ""]]
        AssertDescription: AuthAuthority is required for Oidc.
  # The DNS-token rules are guarded with `CertMode != Byo`: in Byo mode Caddy serves a
  # supplied cert and never runs ACME DNS-01, so the provider token is unused. A customer
  # whose domain is on Cloudflare and who brings their own cert legitimately sets
  # DnsProvider=Cloudflare with an empty token — these rules must not reject that.
  CloudflareRequiresToken:
    RuleCondition: !And
      - !Equals [!Ref DnsProvider, Cloudflare]
      - !Not [!Equals [!Ref CertMode, Byo]]
    Assertions:
      - Assert: !Not [!Equals [!Ref CloudflareApiToken, ""]]
        AssertDescription: CloudflareApiToken is required when DnsProvider=Cloudflare (Caddy's DNS-01 has no credential otherwise).
  Route53RequiresHostedZone:
    RuleCondition: !Equals [!Ref DnsProvider, Route53]
    Assertions:
      - Assert: !Not [!Equals [!Ref HostedZoneId, ""]]
        AssertDescription: Enter the hosted zone ID whenever the DNS provider is Route53, including when you bring your own certificate. Leave it blank for other DNS providers.
  NewServerRequiresSubnets:
    RuleCondition: !Equals [!Ref DatabaseMode, NewServer]
    Assertions:
      # Fn::Contains (not Fn::Join — unsupported in Rules): the default "" resolves to
      # [""], so a list containing an empty string means no real subnets were supplied.
      - Assert:
          Fn::Not:
            - Fn::Contains:
                - !Ref DbSubnetIds
                - ""
        AssertDescription: DbSubnetIds (two or more subnets in different AZs) is required when DatabaseMode=NewServer.
  ByoCertRequiresCertAndKey:
    RuleCondition: !Equals [!Ref CertMode, Byo]
    Assertions:
      - Assert: !And [!Not [!Equals [!Ref TlsCertificate, ""]], !Not [!Equals [!Ref TlsCertificateKey, ""]]]
        AssertDescription: TlsCertificate and TlsCertificateKey (base64 PEM) are both required when CertMode=Byo.
  DigitalOceanRequiresToken:
    RuleCondition: !And
      - !Equals [!Ref DnsProvider, DigitalOcean]
      - !Not [!Equals [!Ref CertMode, Byo]]
    Assertions:
      - Assert: !Not [!Equals [!Ref DoAuthToken, ""]]
        AssertDescription: DoAuthToken is required when DnsProvider=DigitalOcean.
  GoogleDnsRequiresCreds:
    RuleCondition: !And
      - !Equals [!Ref DnsProvider, GoogleCloudDns]
      - !Not [!Equals [!Ref CertMode, Byo]]
    Assertions:
      - Assert: !And [!Not [!Equals [!Ref GcpProject, ""]], !Not [!Equals [!Ref GcpCredentialsJson, ""]]]
        AssertDescription: GcpProject and GcpCredentialsJson are both required when DnsProvider=GoogleCloudDns.
  ExistingServerRequiresAdmin:
    RuleCondition: !Equals [!Ref DatabaseMode, ExistingServer]
    Assertions:
      - Assert: !And
          - !Not [!Equals [!Ref DbServerHost, ""]]
          - !Not [!Equals [!Ref DbAdminUsername, ""]]
          - !Not [!Equals [!Ref DbAdminPassword, ""]]
          - !Not [!Equals [!Ref DbServerSecurityGroupId, ""]]
        AssertDescription: DbServerHost, DbAdminUsername, DbAdminPassword and DbServerSecurityGroupId are all required when DatabaseMode=ExistingServer.
  ExistingDatabaseRequiresConnString:
    RuleCondition: !Equals [!Ref DatabaseMode, ExistingDatabase]
    Assertions:
      - Assert: !Not [!Equals [!Ref DatabaseConnectionString, ""]]
        AssertDescription: DatabaseConnectionString is required when DatabaseMode=ExistingDatabase.
  LocalRequiresAz:
    # Local's EBS data volume is created in DataVolumeAz and attached to the instance at launch; an EBS
    # volume can only attach to an instance in its OWN AZ, and a Subnet parameter's AZ is not derivable
    # in CloudFormation — so the AZ must be supplied and must match InstanceSubnetId's AZ.
    RuleCondition: !Equals [!Ref DatabaseMode, Local]
    Assertions:
      - Assert: !Not [!Equals [!Ref DataVolumeAz, ""]]
        AssertDescription: DataVolumeAz (the AZ of InstanceSubnetId) is required when DatabaseMode=Local.
  ElasticIpAllocationRequiresAddress:
    # The allocation id drives the association; the address feeds DNS, broch's public-IP seed and the
    # outputs. Pure CloudFormation can't look one up from the other, so both are required together
    # (and wait-eip.sh checks at boot that they match).
    Assertions:
      - Assert: !Or
          - !And [!Equals [!Ref ElasticIpAllocationId, ""], !Equals [!Ref ElasticIpAddress, ""]]
          - !And [!Not [!Equals [!Ref ElasticIpAllocationId, ""]], !Not [!Equals [!Ref ElasticIpAddress, ""]]]
        AssertDescription: Set ElasticIpAllocationId and ElasticIpAddress together (or leave both empty).
  SnapshotRestoreRequiresLocalDbPassword:
    # Postgres keeps the password its data directory was initialised with, so a restored volume with
    # a freshly generated password can never go healthy (a guaranteed 25-minute rollback).
    RuleCondition: !And
      - !Equals [!Ref DatabaseMode, Local]
      - !Not [!Equals [!Ref DataVolumeSnapshotId, ""]]
    Assertions:
      - Assert: !Not [!Equals [!Ref LocalDbAdminPassword, ""]]
        AssertDescription: DataVolumeSnapshotId needs LocalDbAdminPassword set to the password the restored data was initialised with.

Resources:
  # ── Secrets (born in the customer account; never transit Broch) ──────────────
  # The master key is CUSTOMER-SUPPLIED (BrochMasterKey), never generated — stored here only so
  # the instance can read it at boot via the instance role (keeping it out of UserData). Storing
  # the same customer value every deploy is idempotent; a generated key would change on redeploy
  # and could no longer decrypt an existing database's keyring.
  #
  # Every secret Name is SALTED with this stack incarnation's UUID (the third segment of
  # AWS::StackId). Secrets Manager delete is a 30-day soft delete with no in-template override
  # (no RecoveryWindowInDays property in CloudFormation), so a delete+redeploy under the same
  # stack name — or a retry after a rolled-back first deploy — would otherwise collide with the
  # soft-deleted ghost ("You can't create this secret because a secret with this name is already
  # scheduled for deletion"). A new stack incarnation mints a new UUID → fresh names → no
  # collision, ever. The UUID is stable across in-place UPDATEs of the same stack, so updates
  # never rename (and thus never replace) the secrets. Consumers reference by !Ref/ARN or fetch
  # by the SAME salted name (render-secrets builds it from the identical Sub variables) — nothing
  # depends on an unsalted name.
  MasterKeySecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub
        - "${AWS::StackName}-${Salt}/broch-master-key"
        - Salt: !Select [2, !Split ["/", !Ref "AWS::StackId"]]
      Description: Broch at-rest encryption root (BROCH_MASTER_KEY). Customer-supplied; the same value must be supplied on every redeploy that reuses the DB.
      SecretString: !Ref BrochMasterKey

  DbPasswordSecret:
    Type: AWS::SecretsManager::Secret
    Condition: IsNewServer
    Properties:
      Name: !Sub
        - "${AWS::StackName}-${Salt}/broch-db-password"
        - Salt: !Select [2, !Split ["/", !Ref "AWS::StackId"]]
      Description: Master password for the provisioned RDS Postgres.
      GenerateSecretString:
        SecretStringTemplate: '{"username":"broch"}'
        GenerateStringKey: password
        PasswordLength: 32
        ExcludePunctuation: true

  # On-box Postgres password (DatabaseMode=Local). Generated (stable within the stack) unless the
  # operator supplied LocalDbAdminPassword. render-secrets.sh reads it at boot and writes it as
  # POSTGRES_PASSWORD in .env; the with-postgres compose feeds it to both the postgres service and
  # broch's connection string. ExcludePunctuation so it is safe inside that connection string.
  #
  # UpdateReplacePolicy Retain: Name is immutable, so a template-version upgrade that renames this
  # secret REPLACES it — and a replaced GenerateSecretString secret mints a brand-new value, while
  # the on-box Postgres data dir keeps the password it was initialised with. Retaining the old
  # secret on replacement keeps that original password readable (live, under the old name) so an
  # operator can recover it and pass it as LocalDbAdminPassword. Deliberately NOT set on the other
  # generated secrets: the RDS master password re-syncs from the new secret via its dynamic
  # reference, and the ExistingServer carve re-ALTERs the broch role on the next boot.
  # DeletionPolicy stays Delete (explicit for the W3011 pairing): on stack DELETION the secret
  # soft-deletes normally — the salted names make that ghost harmless to any future deploy, and
  # retaining on delete would leak a live secret per deleted stack. Only REPLACEMENT retains.
  LocalDbPasswordSecret:
    Type: AWS::SecretsManager::Secret
    Condition: IsLocal
    UpdateReplacePolicy: Retain
    DeletionPolicy: Delete
    Properties:
      Name: !Sub
        - "${AWS::StackName}-${Salt}/broch-local-db-password"
        - Salt: !Select [2, !Split ["/", !Ref "AWS::StackId"]]
      Description: Password for the bundled on-box Postgres (DatabaseMode=Local).
      SecretString: !If [HasLocalDbPassword, !Ref LocalDbAdminPassword, !Ref "AWS::NoValue"]
      GenerateSecretString: !If
        - HasLocalDbPassword
        - !Ref "AWS::NoValue"
        - { PasswordLength: 32, ExcludePunctuation: true }

  # ── ExistingServer carve secrets ─────────────────────────────────────────────
  # Admin password: used ONCE at boot to create the brochdb + broch role, then dropped.
  DbAdminPasswordSecret:
    Type: AWS::SecretsManager::Secret
    Condition: IsExistingServer
    # W1030: "" default looks empty to cfn-lint; ExistingServer makes it mandatory (Rule enforces).
    Metadata: { cfn-lint: { config: { ignore_checks: [W1030] } } }
    Properties:
      Name: !Sub
        - "${AWS::StackName}-${Salt}/broch-db-admin-password"
        - Salt: !Select [2, !Split ["/", !Ref "AWS::StackId"]]
      SecretString: !Ref DbAdminPassword
  # Generated password for the least-priv broch role (ExcludePunctuation so it's safe to
  # carry through the carve SQL and the connection string unquoted).
  BrochRolePasswordSecret:
    Type: AWS::SecretsManager::Secret
    Condition: IsExistingServer
    Properties:
      Name: !Sub
        - "${AWS::StackName}-${Salt}/broch-role-password"
        - Salt: !Select [2, !Split ["/", !Ref "AWS::StackId"]]
      Description: Password for the least-privilege broch role carved onto the existing server.
      GenerateSecretString:
        PasswordLength: 32
        ExcludePunctuation: true

  # ── User-supplied secrets (kept OUT of UserData) ─────────────────────────────
  # NoEcho hides a parameter from describe-stacks output, but a value substituted
  # into UserData via Fn::Sub is still recoverable by anyone with
  # ec2:DescribeInstanceAttribute or anything that can reach the IMDS user-data
  # endpoint. So each provided secret is stashed here and fetched at boot by the
  # instance role (render-secrets.sh). SecretString is the RAW parameter value (no JSON
  # wrapper, never re-scanned by Fn::Sub). render-secrets.sh writes each one single-quoted to
  # .env, so the parameters' AllowedPattern refuses a single quote, a line break or a trailing
  # backslash, and the script itself refuses one edited into the secret later.
  CloudflareTokenSecret:
    Type: AWS::SecretsManager::Secret
    Condition: HasCloudflareToken
    Properties:
      Name: !Sub
        - "${AWS::StackName}-${Salt}/broch-cloudflare-token"
        - Salt: !Select [2, !Split ["/", !Ref "AWS::StackId"]]
      SecretString: !Ref CloudflareApiToken

  ConnStringSecret:
    Type: AWS::SecretsManager::Secret
    Condition: IsExistingDatabase
    # W1030: cfn-lint sees DatabaseConnectionString's "" default and warns the
    # SecretString could be empty. It can't infer that ExistingDatabase mode makes the
    # connection string mandatory — the ExistingDatabaseRequiresConnString Rule enforces
    # that at stack-create (an empty value fails the deploy loudly), but cfn-lint doesn't
    # evaluate Rules, so the static warning persists and is suppressed here.
    Metadata:
      cfn-lint:
        config:
          ignore_checks: [W1030]
    Properties:
      Name: !Sub
        - "${AWS::StackName}-${Salt}/broch-conn-string"
        - Salt: !Select [2, !Split ["/", !Ref "AWS::StackId"]]
      SecretString: !Ref DatabaseConnectionString

  AuthClientSecretSecret:
    Type: AWS::SecretsManager::Secret
    Condition: HasAuthClientSecret
    Properties:
      Name: !Sub
        - "${AWS::StackName}-${Salt}/broch-auth-client-secret"
        - Salt: !Select [2, !Split ["/", !Ref "AWS::StackId"]]
      SecretString: !Ref AuthClientSecret

  # BYO-cert: the supplied wildcard cert + key (base64 PEM), fetched at boot and
  # decoded into /opt/broch/certs/. The private key especially must not ride in UserData.
  TlsCertSecret:
    Type: AWS::SecretsManager::Secret
    Condition: IsByoCert
    Metadata: { cfn-lint: { config: { ignore_checks: [W1030] } } }
    Properties:
      Name: !Sub
        - "${AWS::StackName}-${Salt}/broch-tls-cert"
        - Salt: !Select [2, !Split ["/", !Ref "AWS::StackId"]]
      SecretString: !Ref TlsCertificate
  TlsKeySecret:
    Type: AWS::SecretsManager::Secret
    Condition: IsByoCert
    Metadata: { cfn-lint: { config: { ignore_checks: [W1030] } } }
    Properties:
      Name: !Sub
        - "${AWS::StackName}-${Salt}/broch-tls-key"
        - Salt: !Select [2, !Split ["/", !Ref "AWS::StackId"]]
      SecretString: !Ref TlsCertificateKey

  DoTokenSecret:
    Type: AWS::SecretsManager::Secret
    Condition: HasDoToken
    Properties:
      Name: !Sub
        - "${AWS::StackName}-${Salt}/broch-do-token"
        - Salt: !Select [2, !Split ["/", !Ref "AWS::StackId"]]
      SecretString: !Ref DoAuthToken

  GcpCredsSecret:
    Type: AWS::SecretsManager::Secret
    Condition: HasGcpCreds
    Properties:
      Name: !Sub
        - "${AWS::StackName}-${Salt}/broch-gcp-creds"
        - Salt: !Select [2, !Split ["/", !Ref "AWS::StackId"]]
      SecretString: !Ref GcpCredentialsJson

  RegistryPasswordSecret:
    Type: AWS::SecretsManager::Secret
    Condition: HasRegistryPassword
    Properties:
      Name: !Sub
        - "${AWS::StackName}-${Salt}/broch-registry-password"
        - Salt: !Select [2, !Split ["/", !Ref "AWS::StackId"]]
      SecretString: !Ref RegistryPassword

  # ── Networking ──────────────────────────────────────────────────────────────
  InstanceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Broch instance - HTTP/HTTPS/HTTP3 from the internet.
      VpcId: !Ref VpcId
      # IPv4 and IPv6 both open for HTTP/HTTPS/HTTP3 — without the v6 rules, clients on
      # IPv6-only or dual-stack networks can't reach the appliance.
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: 0.0.0.0/0, Description: HTTP (ACME + redirect) }
        - { IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0, Description: HTTPS }
        - { IpProtocol: udp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0, Description: HTTP/3 (QUIC) }
        - { IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIpv6: "::/0", Description: HTTP (ACME + redirect) IPv6 }
        - { IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIpv6: "::/0", Description: HTTPS IPv6 }
        - { IpProtocol: udp, FromPort: 443, ToPort: 443, CidrIpv6: "::/0", Description: HTTP/3 (QUIC) IPv6 }
      Tags: [{ Key: Name, Value: !Sub "${AWS::StackName}-instance" }]

  SshIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: HasSsh
    Properties:
      GroupId: !Ref InstanceSecurityGroup
      IpProtocol: tcp
      FromPort: 22
      ToPort: 22
      CidrIp: !Ref SshAllowedCidr
      Description: SSH break-glass

  RdsSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Condition: IsNewServer
    Properties:
      GroupDescription: Broch RDS - Postgres from the instance only.
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !Ref InstanceSecurityGroup
          Description: Postgres from the Broch instance
      Tags: [{ Key: Name, Value: !Sub "${AWS::StackName}-rds" }]

  # ExistingServer: open Postgres on the customer's existing server SG to this instance.
  ExistingServerIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: IsExistingServer
    # W1030: DbServerSecurityGroupId is a plain String (default "") so the AWS-type default
    # check doesn't break other modes; ExistingServer makes it mandatory (Rule enforces).
    Metadata: { cfn-lint: { config: { ignore_checks: [W1030] } } }
    Properties:
      GroupId: !Ref DbServerSecurityGroupId
      IpProtocol: tcp
      FromPort: 5432
      ToPort: 5432
      SourceSecurityGroupId: !Ref InstanceSecurityGroup
      Description: !Sub "Postgres from ${AWS::StackName} Broch instance"

  # ── Managed database (NewServer) ────────────────────────────────────────────
  DbSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Condition: IsNewServer
    Properties:
      DBSubnetGroupDescription: !Sub "${AWS::StackName} Broch RDS"
      SubnetIds: !Ref DbSubnetIds

  # Accepted trivy findings (the ignore lines must sit directly above the resource):
  #   AWS-0176 Broch authenticates with the password from Secrets Manager; IAM auth is not used.
  #   AWS-0177 DeletionPolicy and UpdateReplacePolicy Snapshot keep the data if the stack
  #            deletes or replaces the database.
  # trivy:ignore:AWS-0176
  # trivy:ignore:AWS-0177
  BrochDB:
    Type: AWS::RDS::DBInstance
    Condition: IsNewServer
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      DBInstanceIdentifier: !Sub "${AWS::StackName}-postgres"
      Engine: postgres
      # EngineVersion omitted — RDS selects its current default Postgres major.
      # Pin to a specific version (e.g. "17.4") for reproducible upgrades.
      DBInstanceClass: !Ref DbInstanceClass
      AllocatedStorage: !Ref DbAllocatedStorage
      # gp3 to match the EC2 root volume — cheaper per GB than the gp2 default and
      # a flat 3000 IOPS baseline instead of gp2's size-scaled 3 IOPS/GB.
      StorageType: gp3
      StorageEncrypted: true
      DBName: brochdb
      MasterUsername: broch
      MasterUserPassword: !Sub "{{resolve:secretsmanager:${DbPasswordSecret}:SecretString:password}}"
      DBSubnetGroupName: !Ref DbSubnetGroup
      VPCSecurityGroups: [!Ref RdsSecurityGroup]
      PubliclyAccessible: false
      BackupRetentionPeriod: 7
      # CACertificateIdentifier deliberately omitted (RDS picks its current default CA, like
      # EngineVersion above): broch verifies the server against the FULL Amazon RDS CA bundle
      # (SSL Mode=VerifyFull, see render-secrets.sh), which carries every current RDS root CA
      # (RSA2048/RSA4096/ECC384, all commercial regions), so whichever of them RDS selects validates.
      # Pinning one would force a CA-rotation restart onto existing stacks whose instance runs a
      # different CA, for no verification gain. When AWS adds a region or CA generation, refresh the
      # bundle (see build.sh).

  # ── On-box Postgres data volume (DatabaseMode=Local) ─────────────────────────
  # A dedicated, encrypted EBS gp3 volume that holds the bundled Postgres data (mounted at
  # /var/lib/docker/volumes so the named volume lives on it). It is a SEPARATE resource from the
  # instance -- DeletionPolicy/UpdateReplacePolicy=Snapshot -- so the data is preserved across an
  # instance stop/start and snapshotted (never silently wiped) on stack delete. Recreate a new
  # instance via delete + redeploy, NOT an in-place replacement update (the new instance cannot attach
  # a volume the still-present old one holds). The AWS analog of
  # the azure-vm dedicated data disk. Created in DataVolumeAz (must equal InstanceSubnetId's AZ) and
  # attached AT LAUNCH via the instance's Volumes property below (NOT a separate VolumeAttachment,
  # which would deadlock against the instance's CreationPolicy health-signal). "You own EBS
  # snapshots" — there are NO automated backups/PITR here (use NewServer/RDS for managed backups).
  DataVolume:
    Type: AWS::EC2::Volume
    Condition: IsLocal
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      AvailabilityZone: !Ref DataVolumeAz
      Size: !Ref DataVolumeSize
      # Restore path: boot's blkid check finds the snapshot's filesystem and mounts it without mkfs.
      SnapshotId: !If [HasDataVolumeSnapshot, !Ref DataVolumeSnapshotId, !Ref "AWS::NoValue"]
      VolumeType: gp3
      Encrypted: true
      Tags:
        - { Key: Name, Value: !Sub "${AWS::StackName}-data" }
        - { Key: broch:role, Value: local-postgres-data }

  # ── IAM: instance role (Route 53 DNS-01, read its secrets, SSM break-glass) ──
  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ec2.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        # Route 53 DNS-01 via the instance role -- ONLY when DnsProvider=Route53. The token
        # providers don't use the role for DNS and leave HostedZoneId empty (which would make
        # the ChangeResourceRecordSets ARN malformed), so the whole policy is omitted for them.
        - !If
          - IsRoute53
          - PolicyName: route53-dns01
            PolicyDocument:
              Version: "2012-10-17"
              Statement:
                # Read+write the TXT challenge records, scoped to THIS zone only — so a compromised
                # instance can't enumerate or read record sets in other zones on a shared account.
                - Effect: Allow
                  Action: [route53:ChangeResourceRecordSets, route53:ListResourceRecordSets]
                  Resource: !Sub "arn:aws:route53:::hostedzone/${HostedZoneId}"
                # ListHostedZones(ByName) and GetChange don't support resource-level scoping in
                # Route 53 (account-wide by design); they expose only zone names/ids and change
                # status, not record contents.
                - Effect: Allow
                  Action: [route53:ListHostedZones, route53:ListHostedZonesByName]
                  Resource: "*"
                - Effect: Allow
                  Action: route53:GetChange
                  Resource: "arn:aws:route53:::change/*"
          - !Ref AWS::NoValue
        - PolicyName: read-broch-secrets
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                # Scoped to THIS stack incarnation's secret namespace (the StackId-salted
                # prefix — see the Secrets section). Secrets Manager appends a random
                # 6-char suffix to every secret's ARN, so the trailing "-*" matches
                # "<stack>-<uuid>/broch-*-AbCdEf" — covering the master key, DB
                # password, and any of the conditional user-secrets without having to
                # enumerate (and !If) each one that may or may not exist. The salt also
                # means this role can NOT read a previous incarnation's (soft-deleted)
                # secrets of the same stack name.
                Resource: !Sub
                  - "arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${AWS::StackName}-${Salt}/broch-*"
                  - Salt: !Select [2, !Split ["/", !Ref "AWS::StackId"]]
        - PolicyName: cfn-helpers
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # cfn-init reads the large static assets (compose + Caddyfile) from THIS
              # stack's resource metadata at boot (DescribeStackResource); cfn-signal reports
              # boot success/failure back to the Instance's CreationPolicy (SignalResource), so
              # the stack only reaches CREATE_COMPLETE once the box is actually healthy.
              # DescribeStacks: on-version-change.sh applies a BrochVersion update only once the
              # whole stack update is UPDATE_COMPLETE (never mid-update or during a rollback).
              - Effect: Allow
                Action: [cloudformation:DescribeStackResource, cloudformation:SignalResource, cloudformation:DescribeStacks]
                Resource: !Sub "arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${AWS::StackName}/*"
        # First boot waits for CloudFormation's EIP association before database traffic.
        # The instance only reads the association; it must never race CloudFormation by
        # calling AssociateAddress itself (an AlreadyExists error rolls the stack back).
        - PolicyName: verify-elastic-ip
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [ec2:DescribeAddresses, ec2:DescribeTags]
                Resource: "*"

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref InstanceRole]

  # ── Static address + DNS ────────────────────────────────────────────────────
  # Allocated with the stack unless ElasticIpAllocationId brings an existing (customer-owned) one.
  ElasticIp:
    Type: AWS::EC2::EIP
    Condition: CreateElasticIp
    Properties:
      Domain: vpc

  # EC2 can publish an instance ID while its state is still pending. EIPAssociation
  # sometimes calls AssociateAddress at that point and gets InvalidInstanceID,
  # with no timely retry; the instance then waits for an address that never arrives.
  # This gate checks EC2 state before that CFN resource starts. It must NOT Ref
  # Instance: the instance's CreationPolicy waits for boot health, and boot waits
  # for this association. Discover the current instance by its CloudFormation
  # stack/logical-id tags instead. Mirror the instance properties that can require
  # replacement so their changes trigger this gate on stack update.
  InstanceRunningGateRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole"
      Policies:
        - PolicyName: describe-instance
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: ec2:DescribeInstances
                Resource: "*"

  InstanceRunningGateFunction:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt InstanceRunningGateRole.Arn
      Timeout: 900
      Code:
        ZipFile: |
          import json
          import time
          import urllib.request

          import boto3
          def respond(event, context, status, reason, physical_id=None):
              selected_id = physical_id or event.get("PhysicalResourceId")
              body = {
                  "Status": status,
                  "Reason": reason,
                  "PhysicalResourceId": selected_id or
                      event["StackId"] + "/" + event["LogicalResourceId"],
                  "StackId": event["StackId"],
                  "RequestId": event["RequestId"],
                  "LogicalResourceId": event["LogicalResourceId"],
              }
              if status == "SUCCESS" and event["RequestType"] != "Delete":
                  body["Data"] = {"InstanceId": selected_id}
              request = urllib.request.Request(
                  event["ResponseURL"], data=json.dumps(body).encode("utf-8"),
                  headers={"Content-Type": ""}, method="PUT")
              with urllib.request.urlopen(request, timeout=10):
                  pass


          def handler(event, context):
              if event["RequestType"] == "Delete":
                  respond(event, context, "SUCCESS", "Gate removed")
                  return
              props = event["ResourceProperties"]
              old_props = event.get("OldResourceProperties", {})
              old_id = event.get("PhysicalResourceId")
              replacement_fields = ("ImageId", "SubnetId", "RootVolumeSize",
                                    "RootVolumeType", "RootVolumeEncrypted")
              replacing = (event["RequestType"] == "Update" and
                           any(props[name] != old_props.get(name) for name in replacement_fields))
              ec2 = boto3.client("ec2")
              deadline = time.monotonic() + min(870, context.get_remaining_time_in_millis() / 1000 - 15)
              running_since = None
              seen_id = None
              try:
                  while time.monotonic() < deadline:
                      reservations = ec2.describe_instances(Filters=[
                          {"Name": "tag:aws:cloudformation:stack-id", "Values": [event["StackId"]]},
                          {"Name": "tag:aws:cloudformation:logical-id", "Values": ["Instance"]},
                      ])["Reservations"]
                      matches = [instance for reservation in reservations
                                 for instance in reservation["Instances"]
                                 if instance["ImageId"] == props["ImageId"] and
                                 instance["SubnetId"] == props["SubnetId"] and
                                 instance["State"]["Name"] not in ("shutting-down", "terminated") and
                                 (not replacing or instance["InstanceId"] != old_id)]
                      if matches:
                          instance = max(matches, key=lambda item: item["LaunchTime"])
                          instance_id = instance["InstanceId"]
                          state = instance["State"]["Name"]
                          if instance_id != seen_id:
                              seen_id = instance_id
                              running_since = None
                          if state == "running":
                              # A failed Create can leave a placeholder PhysicalResourceId.
                              # Always discover the current instance before returning its ID.
                              if event["RequestType"] == "Update" and not replacing and instance_id == old_id:
                                  respond(event, context, "SUCCESS", "Instance unchanged", instance_id)
                                  return
                              if running_since is None:
                                  running_since = time.monotonic()
                              # EC2 can report running before its modify APIs see the new instance.
                              if time.monotonic() - running_since >= 30:
                                  respond(event, context, "SUCCESS", "Instance running and settled", instance_id)
                                  return
                          else:
                              running_since = None
                      else:
                          seen_id = None
                          running_since = None
                      time.sleep(5)
                  raise TimeoutError("Current stack instance did not reach running state")
              except Exception as error:
                  respond(event, context, "FAILED", str(error)[:300])

  InstanceRunningGate:
    Type: AWS::CloudFormation::CustomResource
    Properties:
      ServiceToken: !GetAtt InstanceRunningGateFunction.Arn
      ServiceTimeout: 960
      # Start after the mode-specific launch prerequisite, without depending on
      # Instance CREATE_COMPLETE (which is held by its health CreationPolicy).
      ProfileReady: !Ref InstanceProfile
      Prerequisite: !If [IsNewServer, !Ref BrochDB, !If [IsLocal, !Ref DataVolume, ""]]
      ImageId: !Ref UbuntuAmi
      SubnetId: !Ref InstanceSubnetId
      RootVolumeSize: 30
      RootVolumeType: gp3
      RootVolumeEncrypted: true

  # Keep CloudFormation as the attachment owner so stack updates and rollbacks
  # retain the association. The gate returns the running instance ID as a
  # custom-resource attribute. Ref Instance here would wait for its health
  # CreationPolicy, but first boot itself waits for this association.
  ElasticIpAssociation:
    Type: AWS::EC2::EIPAssociation
    Properties:
      AllocationId: !If [CreateElasticIp, !GetAtt ElasticIp.AllocationId, !Ref ElasticIpAllocationId]
      InstanceId: !GetAtt InstanceRunningGate.InstanceId

  # apex + wildcard A records: only when Route 53 owns the domain AND DnsAutoRecords=Auto.
  # Off-Route53 providers (Cloudflare/GCP/DO) host their own zone -- their A records come from
  # caddy-dynamicdns (Auto, not Byo) or the customer (Manual / Byo). DnsAutoRecords=Manual skips these even on Route 53, so an operator
  # fronting the instance with an ALB/NAT can point DNS at that front-end instead.
  ApexRecord:
    Type: AWS::Route53::RecordSet
    Condition: IsRoute53AutoRecords
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !If [HasShareSubdomain, !Sub "${ShareSubdomain}.${DnsZone}.", !Sub "${DnsZone}."]
      Type: A
      TTL: "60"
      ResourceRecords: [!If [CreateElasticIp, !Ref ElasticIp, !Ref ElasticIpAddress]]

  WildcardRecord:
    Type: AWS::Route53::RecordSet
    Condition: IsRoute53AutoRecords
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !If [HasShareSubdomain, !Sub "*.${ShareSubdomain}.${DnsZone}.", !Sub "*.${DnsZone}."]
      Type: A
      TTL: "60"
      ResourceRecords: [!If [CreateElasticIp, !Ref ElasticIp, !Ref ElasticIpAddress]]

  # ── The instance ────────────────────────────────────────────────────────────
  # False positive: MetadataOptions below requires IMDSv2 (HttpTokens: required); trivy doesn't read it here.
  # trivy:ignore:AWS-0028
  Instance:
    Type: AWS::EC2::Instance
    # cfn-init writes the large boot assets (compose + the CertMode-selected Caddyfile +
    # render-secrets.sh) at boot from template metadata -- which is staged in S3 with the
    # template and has no size limit -- instead of UserData, which EC2 hard-caps at 25,600
    # bytes base64-encoded (19,200 bytes raw). build.sh substitutes the same base64 blobs into
    # the placeholders below; they are just relocated from UserData's write_files to here.
    # CreationPolicy: the stack does NOT reach CREATE_COMPLETE until cfn-signal fires from the
    # end of runcmd. Without it, `aws cloudformation deploy` returns the moment the EC2 instance
    # is RUNNING -- before Docker install, secret hydration, the DB carve, and container health --
    # and a boot FAILURE would still report CREATE_COMPLETE (a silent production failure). The
    # generous timeout covers a cold image pull + the broch container's healthcheck (which waits on
    # the database -- RDS for NewServer, or the external/existing server -- before reporting healthy).
    CreationPolicy:
      ResourceSignal:
        Count: 1
        # PT25M, not PT20M: on a cold t4g the serial pre-health work (apt+docker install, cfn-init,
        # AWS CLI install, ExistingServer psql-client + carve, cold image pull) can run ~6-10 min
        # BEFORE the up-to-600s health wait even starts, so 20 min left too little margin and could
        # roll back an instance that was about to go healthy.
        Timeout: PT25M
    Metadata:
      # The one key cfn-hup watches (/etc/cfn/hooks.conf). A BrochVersion stack update changes only
      # this metadata, so it applies in place via on-version-change.sh.
      BrochVersion: !Ref BrochVersion
      AWS::CloudFormation::Init:
        config:
          files:
            # DatabaseMode picks the compose: Local runs the bundled-Postgres compose
            # (docker-compose/with-postgres); every other mode runs the external-Postgres compose
            # (with-postgres-external). Both base64-embedded by build.sh into the two placeholders
            # below. Mirrors the azure-vm selectedCompose ternary.
            /opt/broch/docker-compose.yml:
              content: !If [IsLocal, "__COMPOSE_LOCAL_B64__", "__COMPOSE_B64__"]
              encoding: base64
              mode: "000644"
              owner: root
              group: root
            # CertMode picks the Caddyfile: Auto (ACME DNS-01, imports tls.caddy) or
            # Byo (static cert from /opt/broch/certs, no ACME). Both embedded by build.sh.
            /opt/broch/Caddyfile:
              content: !If [IsByoCert, "__CADDYFILE_BYO_B64__", "__CADDYFILE_AUTO_B64__"]
              encoding: base64
              mode: "000644"
              owner: root
              group: root
            # Amazon RDS CA bundle (public CA certificates, SHA-256-pinned in build.sh). The compose
            # mounts /opt/broch/db-ca read-only into broch at /etc/broch/db-ca, so a connection string
            # can say SSL Mode=VerifyFull;Root Certificate=/etc/broch/db-ca/rds-global-bundle.pem. The
            # ExistingServer carve's psql reads it from this host path. Written in every mode (inert
            # for Local) so an ExistingDatabase string can reference it too.
            /opt/broch/db-ca/rds-global-bundle.pem:
              content: "__RDS_CA_BUNDLE_B64__"
              encoding: base64
              mode: "000644"
              owner: root
              group: root
            # First boot waits for CloudFormation's ElasticIpAssociation BEFORE render-secrets.sh
            # (the ExistingServer carve) and broch's first database connection. The instance
            # never associates the address itself; that would race CloudFormation and prevent
            # reliable rollback. InstanceRunningGate waits until EC2 reports running before
            # CloudFormation attempts the association. A mismatched BYO address or an address
            # held outside this stack fails boot. Shell vars are unbraced (Fn::Sub).
            /opt/broch/wait-eip.sh:
              mode: "000700"
              owner: root
              group: root
              content: !Sub
                - |
                  #!/bin/sh
                  alloc='${Alloc}'
                  addr='${Addr}'
                  region='${AWS::Region}'
                  stackid='${AWS::StackId}'
                  fatal() { echo "FATAL: $1" >&2; echo "wait-eip: $1" >> /opt/broch/boot-fatal; exit 0; }
                  tok=$(curl -fsS --max-time 5 -X PUT -H 'X-aws-ec2-metadata-token-ttl-seconds: 60' http://169.254.169.254/latest/api/token) || fatal "IMDS token failed"
                  iid=$(curl -fsS --max-time 5 -H "X-aws-ec2-metadata-token: $tok" http://169.254.169.254/latest/meta-data/instance-id) || fatal "IMDS instance-id failed"
                  # A fresh Elastic IP may briefly return InvalidAllocationID.NotFound; retry while EC2 propagates it.
                  last_error=none
                  for attempt in $(seq 1 60); do
                    if ! info=$(/usr/local/bin/aws ec2 describe-addresses --region "$region" --allocation-ids "$alloc" --query 'Addresses[0].[PublicIp,AssociationId,InstanceId]' --output text 2>&1); then
                      last_error=$info
                      echo "Waiting for Elastic IP $alloc: describe-addresses failed (attempt $attempt/60): $last_error" >&2
                      sleep 5
                      continue
                    fi
                    pub=$(printf '%s' "$info" | cut -f1); assoc=$(printf '%s' "$info" | cut -f2); owner=$(printf '%s' "$info" | cut -f3)
                    if [ -z "$pub" ] || [ "$pub" = None ]; then sleep 5; continue; fi
                    if [ "$pub" != "$addr" ]; then fatal "ElasticIpAddress $addr does not match allocation $alloc (its address is $pub)"; fi
                    if [ "$owner" = "$iid" ]; then
                      # Give outbound routing a moment to converge before the database setup.
                      sleep 5
                      echo "Elastic IP $addr ($alloc) is on this instance for first boot"
                      exit 0
                    fi
                    if [ "$assoc" != None ]; then
                      if [ "$owner" = None ]; then fatal "Elastic IP $alloc ($addr) is attached to a network interface outside this stack; disassociate it first"; fi
                      if ! owner_stack=$(/usr/local/bin/aws ec2 describe-tags --region "$region" --filters "Name=resource-id,Values=$owner" "Name=key,Values=aws:cloudformation:stack-id" --query 'Tags[0].Value' --output text 2>&1); then
                        last_error=$owner_stack
                        echo "Waiting for Elastic IP $alloc: describe-tags failed (attempt $attempt/60): $last_error" >&2
                        sleep 5
                        continue
                      fi
                      if [ "$owner_stack" != "$stackid" ]; then fatal "Elastic IP $alloc ($addr) is associated with $owner, outside this stack; disassociate it first"; fi
                    fi
                    sleep 5
                  done
                  fatal "Elastic IP $alloc ($addr) was not attached to this instance by CloudFormation within 5 minutes; last EC2 error: $last_error"
                - Alloc: !If [CreateElasticIp, !GetAtt ElasticIp.AllocationId, !Ref ElasticIpAllocationId]
                  Addr: !If [CreateElasticIp, !Ref ElasticIp, !Ref ElasticIpAddress]
            # The version this instance is meant to run. First boot records the stack's BrochVersion
            # here; afterwards only on-version-change.sh (cfn-hup, below) rewrites it, once a
            # BrochVersion stack update has settled and the new image is pulled.
            /opt/broch/stack-version:
              mode: "000644"
              owner: root
              group: root
              content: !Sub "${BrochVersion}\n"
            # Converges BROCH_VERSION in .env to /opt/broch/stack-version. First boot runs it, and
            # broch.service runs it before EVERY start (ExecStartPre), so a hand edit of .env is undone
            # on the next start. It refuses (fails the start, closed) when .env already names a NEWER
            # release than stack-version: broch has migrated the database for that release, and
            # starting the older one against it is the one outcome worse than not starting.
            /opt/broch/set-version.sh:
              mode: "000700"
              owner: root
              group: root
              content: |
                #!/bin/sh
                set -eu
                v=$(cat /opt/broch/stack-version)
                case "$v" in ''|*[!A-Za-z0-9_.-]*) echo "set-version: invalid /opt/broch/stack-version '$v'" >&2; exit 1 ;; esac
                f=/opt/broch/.env
                old=$(sed -n 's/^BROCH_VERSION=//p' "$f")
                semver='^[0-9]+\.[0-9]+\.[0-9]+$'
                if [ -n "$old" ] && [ "$old" != "$v" ] && echo "$old" | grep -Eq "$semver" && echo "$v" | grep -Eq "$semver" && [ "$(printf '%s\n%s\n' "$old" "$v" | sort -V | head -n1)" = "$v" ]; then
                  echo "set-version: .env has BROCH_VERSION=$old, newer than the stack's $v. Starting $v would run an older broch on a database already migrated for $old. Update the stack's BrochVersion to $old." >&2
                  exit 1
                fi
                if grep -q '^BROCH_VERSION=' "$f"; then sed -i "s|^BROCH_VERSION=.*|BROCH_VERSION=$v|" "$f"; else printf 'BROCH_VERSION=%s\n' "$v" >> "$f"; fi
            # cfn-hup action for the Instance's BrochVersion metadata key (a small leaf, delivered in
            # $CFN_NEW_METADATA; the Init block is far too large for an environment variable). A
            # BrochVersion stack update is metadata-only (no stop/start, no replacement); this applies
            # it in place. Guarded because broch migrates its database forward on start, irreversibly:
            #  - "done" means the RUNNING broch container is on the target tag, so a failed switch is
            #    retried (exit 1 = cfn-hup retries on its next poll, without recording the change);
            #  - wait for the stack to settle, then apply the stack's CURRENT BrochVersion only: after a
            #    rollback or a newer update the metadata changes again and arrives here as its own run;
            #  - refuse a downgrade between release numbers, leaving /opt/broch/version-mismatch;
            #  - pull the new image BEFORE touching the running container, so a bad tag leaves the old
            #    version running;
            #  - recreate only the broch container (Caddy keeps serving).
            # Idempotent: the first poll after create (post.add) finds nothing to do.
            /opt/broch/on-version-change.sh:
              mode: "000700"
              owner: root
              group: root
              content: !Sub |
                #!/bin/sh
                set -u
                log() { echo "broch-version: $*"; logger -t broch-version "$*" 2>/dev/null || true; }
                # cfn-hup passes a string metadata leaf through raw (only non-strings are JSON-encoded);
                # strip surrounding quotes defensively in case a future cfn-hup encodes it.
                want=$(printf '%s' "$CFN_NEW_METADATA" | sed 's/^"\(.*\)"$/\1/')
                case "$want" in ''|*[!A-Za-z0-9_.-]*) log "ignoring invalid BrochVersion '$want'"; exit 0 ;; esac
                cd /opt/broch || exit 1
                cid=$(docker compose ps -q broch 2>/dev/null | head -n1)
                run=""
                if [ -n "$cid" ]; then run=$(docker inspect -f '{{.Config.Image}}' "$cid" 2>/dev/null | sed 's/.*://'); fi
                recorded=$(cat /opt/broch/stack-version 2>/dev/null || true)
                if [ "$run" = "$want" ] && [ "$recorded" = "$want" ]; then exit 0; fi
                if [ -s /opt/broch/boot-fatal ]; then log "first boot failed; not applying BrochVersion=$want"; exit 0; fi
                out=ERR
                st=ERR
                for _ in $(seq 1 120); do
                  # shellcheck disable=SC2016 # the backticks are a JMESPath literal, not a substitution
                  out=$(/usr/local/bin/aws cloudformation describe-stacks --region '${AWS::Region}' --stack-name '${AWS::StackId}' --query 'Stacks[0].[StackStatus,Parameters[?ParameterKey==`BrochVersion`].ParameterValue|[0]]' --output text 2>/dev/null) || out=ERR
                  st=$(printf '%s' "$out" | cut -f1)
                  case "$st" in *_IN_PROGRESS|ERR|'') sleep 30 ;; *) break ;; esac
                done
                case "$st" in *_IN_PROGRESS|ERR|'') log "stack status unavailable ($st); will retry"; exit 1 ;; esac
                param=$(printf '%s' "$out" | cut -f2)
                if [ "$param" != "$want" ]; then log "the stack's BrochVersion is now $param ($st), not $want; that change arrives as its own run"; exit 0; fi
                cur=$run
                if [ -z "$cur" ]; then cur=$recorded; fi
                semver='^[0-9]+\.[0-9]+\.[0-9]+$'
                if [ "$cur" != "$want" ] && echo "$cur" | grep -Eq "$semver" && echo "$want" | grep -Eq "$semver" && [ "$(printf '%s\n%s\n' "$cur" "$want" | sort -V | head -n1)" = "$want" ]; then
                  msg="REFUSED downgrade $cur -> $want: the database is already migrated for $cur. Still running $cur; set the stack's BrochVersion back to $cur."
                  printf '%s\n' "$msg" > /opt/broch/version-mismatch
                  log "$msg"
                  exit 0
                fi
                if ! res=$(BROCH_VERSION="$want" docker compose pull broch 2>&1); then
                  log "could not pull broch:$want; still running $cur, will retry: $res"
                  exit 1
                fi
                printf '%s\n' "$want" > /opt/broch/stack-version
                if ! /bin/sh /opt/broch/set-version.sh; then log "set-version failed for $want; will retry"; exit 1; fi
                if ! res=$(docker compose up -d broch 2>&1); then log "docker compose up failed for $want; will retry: $res"; exit 1; fi
                rm -f /opt/broch/version-mismatch
                log "BrochVersion $cur -> $want applied"
            /etc/cfn/cfn-hup.conf:
              mode: "000400"
              owner: root
              group: root
              content: !Sub |
                [main]
                stack=${AWS::StackId}
                region=${AWS::Region}
                interval=1
            # hooks.conf, not hooks.d/: cfn-hup parses every file in hooks.d, including the .bak copies
            # a later cfn-init run leaves behind.
            /etc/cfn/hooks.conf:
              mode: "000400"
              owner: root
              group: root
              content: |
                [broch-version]
                triggers=post.add,post.update
                path=Resources.Instance.Metadata.BrochVersion
                action=/bin/sh /opt/broch/on-version-change.sh
            /etc/systemd/system/cfn-hup.service:
              mode: "000644"
              owner: root
              group: root
              content: |
                [Unit]
                Description=cfn-hup (applies BrochVersion stack updates to this instance)
                # After broch.service: a version change pending across a stop/start must not race the
                # boot-time `up --force-recreate` for the broch container.
                After=network-online.target broch.service
                Wants=network-online.target
                StartLimitIntervalSec=0
                [Service]
                Type=simple
                # cfn-hup's pidfile lock never breaks a stale file (after an OOM kill, say), which would
                # loop every restart; systemd already guarantees a single instance.
                ExecStartPre=-/bin/rm -f /var/run/cfn-hup.pid
                ExecStart=/usr/local/bin/cfn-hup
                Restart=always
                RestartSec=30
                [Install]
                WantedBy=multi-user.target
            # Boot-time secret hydration script. Relocated here from UserData's write_files:
            # its ~170 lines pushed base64-encoded UserData past EC2's 25,600-byte hard cap
            # (metadata has no such cap). Runcmd invokes it AFTER cfn-init writes it -- same
            # sequence point as before. Same Fn::Sub semantics as UserData, incl. the
            # dollar-brace-bang escapes; the substitution map carries the condition-derived
            # values the script branches on.
            /opt/broch/render-secrets.sh:
              mode: "000700"
              owner: root
              group: root
              content:
                Fn::Sub:
                  - |
                    #!/usr/bin/env bash
                    # Boot-time secret hydration. Fetches the stack's secrets with the
                    # instance role (the host is 1 hop from IMDS, so the default hop limit
                    # is fine here) and APPENDS them to /opt/broch/.env before broch.service
                    # starts. Keeping these out of UserData is the whole point -- see the
                    # secrets comment in the template.
                    set -euo pipefail
                    env_file=/opt/broch/.env
                    # certs/ is bind-mounted into the Caddy container; ensure it exists (empty in
                    # Auto+Route53/Cloudflare, populated for Byo cert and GoogleCloudDns).
                    mkdir -p /opt/broch/certs
                    # Caddy's TLS fragment (the tls {...} block the Caddyfile imports), selected per
                    # DnsProvider from the CANONICAL single source docker-compose/caddy-tls/*.caddy,
                    # which build.sh base64-embeds into the __TLS_*_B64__ placeholders below. Route53
                    # uses route53-iam.caddy (bare 'dns route53' -- this appliance authenticates Route
                    # 53 with its INSTANCE ROLE, not env keys). The propagation tuning lives in those
                    # fragments; scripts/check-caddy-dns-sync.py fails CI if any target drifts from
                    # them. base64 output is $/{-free, so it is safe inside this Fn::Sub UserData.
                    case "${CertMode}" in
                      Byo) printf '# BYO-cert mode: TLS is set in the Caddyfile; this fragment is unused.\n' > /opt/broch/tls.caddy ;;
                      *)
                        case "${DnsProvider}" in
                          Cloudflare)     printf '%s' '__TLS_CLOUDFLARE_B64__'     | base64 -d > /opt/broch/tls.caddy ;;
                          DigitalOcean)   printf '%s' '__TLS_DIGITALOCEAN_B64__'   | base64 -d > /opt/broch/tls.caddy ;;
                          GoogleCloudDns) printf '%s' '__TLS_GOOGLECLOUDDNS_B64__' | base64 -d > /opt/broch/tls.caddy ;;
                          *)              printf '%s' '__TLS_ROUTE53_B64__'         | base64 -d > /opt/broch/tls.caddy ;;
                        esac
                        ;;
                    esac

                    # Automatic apex + wildcard A records (DnsAutoRecords=Auto): render the caddy-dynamicdns
                    # block into /opt/broch/dynamic-dns.caddy so Caddy keeps them pointed at this instance's
                    # Elastic IP, reusing the same DnsProvider credential as tls.caddy. ip_source is broch:
                    # Caddy fetches the IP from broch's internal /internal/public-ip endpoint, which broch
                    # seeds at deploy from this stack's Elastic IP (BROCH_PUBLIC_IP) and an admin can override
                    # at runtime -- so the record points at the IP we KNOW, not one Caddy has to discover. SKIPPED
                    # for Byo (no DNS credential), Manual (you own the records), and Route53 -- which already
                    # gets native apex+wildcard A records from the stack's AWS::Route53::RecordSet resources,
                    # so dynamic_dns would double-manage them. Always writes the file (empty when skipped)
                    # because the Caddyfile's global block imports it. The write zone is DnsZone normally, or
                    # the DELEGATED DnsZoneName when the host lives on a subdomain that is its own zone; the
                    # record labels are the host RELATIVE to that write zone (mirrors the azure-vm cloud-init).
                    # The suffix-strip needs shell brace expansion, which collides with Fn::Sub's dollar-brace,
                    # so those expansions are written with the Fn::Sub bang-escape (which renders back to a
                    # plain dollar-brace shell expansion) rather than a bare dollar-brace CFn ref.
                    printf '# Automatic A-records disabled (DnsAutoRecords=Manual/Byo, or Route53 native records). Manage DNS yourself.\n' > /opt/broch/dynamic-dns.caddy
                    # Best-effort: auto-DNS must NEVER abort render-secrets.sh -- a failure here would
                    # leave .env unhydrated and roll the whole stack back. The subshell inherits `set -e`,
                    # so any failure aborts IT (leaving the manual stub above intact), and `|| true` keeps
                    # the parent script going. Mirrors the azure-vm cloud-init "never block the deploy".
                    (
                      if [ "${DnsAutoRecords}" = "Auto" ] && [ "${CertMode}" != "Byo" ] && [ "${DnsProvider}" != "Route53" ]; then
                        zone='${DnsZone}'
                        sub='${ShareSubdomain}'
                        zone_name='${DnsZoneName}'
                        # The public host tls.caddy serves / the URLs use, composed from DnsZone + share subdomain.
                        if [ -z "$sub" ]; then host="$zone"; else host="$sub.$zone"; fi
                        # The zone auto-DNS WRITES into: DnsZone normally, but for a DELEGATED subdomain the real
                        # zone is a subdomain of DnsZone -- passed explicitly as DnsZoneName so we neither assume
                        # nor need a runtime SOA lookup. Resolves to the SAME zone the ACME/tls path uses, so a
                        # valid cert can no longer coexist with an A-record write that 404s. The dollar-brace-bang
                        # forms below are Fn::Sub ESCAPES: CloudFormation renders each back to a plain dollar-brace
                        # shell parameter expansion in the boot script, so they are shell code, NOT CFn refs. (A
                        # bare dollar-brace here WOULD be read as a CFn variable -- hence the escape.)
                        write_zone="${!zone_name:-$zone}"
                        # Fail loud, don't guess: a DnsZoneName that is neither the host nor a parent of it (typo /
                        # wrong zone) would strip nothing below and write a garbage record label -- the same
                        # silent-misconfig class this closes, moved one field over. Skip the block (leaving the
                        # manual stub) and log; auto-DNS falls back to manual. Never fires when DnsZoneName is
                        # empty (host is within DnsZone by construction).
                        if [ "$host" != "$write_zone" ] && [ "${!host%.$write_zone}" = "$host" ]; then
                          echo "auto-DNS: DnsZoneName '$write_zone' does not contain host '$host' -- skipping auto A-records; set it to the zone that contains the host, or leave it empty. DNS stays manual." >&2
                        elif [ -n "$write_zone" ]; then
                          # Record labels = host relative to the write zone: @/* at the zone apex, else the leading
                          # label(s) + their wildcard. ${!host%.$write_zone} strips the zone suffix; equal = apex.
                          if [ "$host" = "$write_zone" ]; then apex='@'; star='*'; else rel="${!host%.$write_zone}"; apex="$rel"; star="*.$rel"; fi
                          tail='\n\tdomains {\n\t\t%s %s %s\n\t}\n\tip_source simple_http http://broch:8080/internal/public-ip\n\tversions ipv4\n\tcheck_interval 5m\n}\n'
                          case "${DnsProvider}" in
                            Cloudflare)     printf "dynamic_dns {\n\tprovider cloudflare {env.CLOUDFLARE_API_TOKEN}$tail" "$write_zone" "$apex" "$star" > /opt/broch/dynamic-dns.caddy ;;
                            DigitalOcean)   printf "dynamic_dns {\n\tprovider digitalocean {env.DO_AUTH_TOKEN}$tail" "$write_zone" "$apex" "$star" > /opt/broch/dynamic-dns.caddy ;;
                            GoogleCloudDns) printf "dynamic_dns {\n\tprovider googleclouddns {\n\t\tgcp_project {env.GCP_PROJECT}\n\t}$tail" "$write_zone" "$apex" "$star" > /opt/broch/dynamic-dns.caddy ;;
                          esac
                        fi
                      fi
                    ) || true

                    # Secret names carry the stack incarnation's StackId-UUID salt (see the Secrets
                    # section); ${StackSalt} below is rendered by Fn::Sub from the SAME expression the
                    # secret Names use, so the fetch prefix can never drift from the created names.
                    get() { aws --region "${AWS::Region}" secretsmanager get-secret-value --secret-id "${AWS::StackName}-${StackSalt}/$1" --query SecretString --output text; }

                    # fatal: log the reason AND record it in /opt/broch/boot-fatal, which the runcmd health
                    # wait checks so the stack signals FAILURE at once instead of timing out ~10 minutes later.
                    fatal() { echo "FATAL: $*" >&2; printf '%s\n' "$*" >> /opt/broch/boot-fatal; exit 1; }

                    # put KEY SECRET: append a secret to .env single-quoted, which docker compose takes literally
                    # (a '#', space, ';' or '$' in a password survives). A single quote, a line break or a trailing
                    # backslash can't be written that way: the parameters refuse them, and this refuses one edited
                    # into the secret afterwards rather than write a broken .env. The fetch keeps a trailing
                    # newline ($(...) would strip it, and a secret edited to end in one would be written
                    # truncated): the CLI's text output ends in exactly one, so any more is the secret's.
                    put() {
                      raw="$(get "$2" && printf x)" || fatal "could not read secret $2"
                      [ "$(printf '%s' "$raw" | wc -l)" -eq 1 ] || fatal "secret $2 contains a line break, which /opt/broch/.env can't carry"
                      v="$(printf '%s' "$raw" | head -n 1)"
                      case "$v" in *"'"*|*\\|*"$(printf '\r')"*) fatal "secret $2 contains a single quote or a carriage return, or ends with a backslash, which /opt/broch/.env can't carry" ;; esac
                      printf "%s='%s'\n" "$1" "$v" >> "$env_file"
                    }

                    put BROCH_MASTER_KEY broch-master-key

                    # Database TLS: VerifyFull = encrypted AND the server authenticated (certificate chains
                    # to the Amazon RDS CA bundle cfn-init wrote, and its name matches Host). Require would
                    # only encrypt -- an on-path attacker could impersonate the server and take the
                    # credentials. host_ca is the bundle on this host (psql); ctr_ca is the same file
                    # inside the broch container (compose mounts /opt/broch/db-ca at /etc/broch/db-ca).
                    host_ca=/opt/broch/db-ca/rds-global-bundle.pem
                    ctr_ca=/etc/broch/db-ca/rds-global-bundle.pem
                    # The shipped bundle holds the COMMERCIAL-partition RDS CAs only; GovCloud and China RDS
                    # sign with other roots, so verification against it can never succeed there -- fail now
                    # with the fix rather than after a connect timeout.
                    require_rds_ca() {
                      [ "${AWS::Partition}" = "aws" ] || fatal "the bundled Amazon RDS CA bundle covers the commercial aws partition only (this stack is in ${AWS::Partition}), so RDS server verification cannot succeed here. NewServer is not supported in this partition; for ExistingServer set DbSslMode=VerifyFullSystemCa (public-CA server) or DbSslMode=Require (encrypt only)."
                      [ -s "$host_ca" ] || fatal "RDS CA bundle $host_ca missing or empty -- cannot verify the database server"
                    }

                    case "${DatabaseMode}" in
                      NewServer)
                        require_rds_ca
                        db_pass="$(get "broch-db-password" | python3 -c 'import sys,json; print(json.load(sys.stdin)["password"])')"
                        # Host is the RDS endpoint address itself, so it matches the certificate's name.
                        printf "BROCH_DB_CONNECTION_STRING='Host=${DbEndpoint};Port=5432;Database=brochdb;Username=broch;Password=%s;SSL Mode=VerifyFull;Root Certificate=%s'\n" "$db_pass" "$ctr_ca" >> "$env_file"
                        ;;
                      ExistingDatabase)
                        put BROCH_DB_CONNECTION_STRING broch-conn-string
                        ;;
                      ExistingServer)
                        # Carve a brochdb + least-priv broch role onto the customer's existing server,
                        # using the admin creds ONCE (not persisted to .env). Idempotent across reboots.
                        apt-get install -y postgresql-client
                        admin_pass="$(get "broch-db-admin-password")"
                        broch_pass="$(get "broch-role-password")"
                        # The carve sends the ADMIN password, so psql never runs in libpq's default
                        # 'prefer' mode (which silently falls back to plaintext). broch's own connection
                        # string below follows the same choice:
                        #   VerifyFull         -- verify-full against the shipped Amazon RDS CA bundle
                        #   VerifyFullSystemCa -- verify-full against the OS trust store (public-CA servers,
                        #                         RDS Proxy); sslrootcert=system needs libpq 16+ (Ubuntu 24.04)
                        #   Require            -- encrypted only, server NOT authenticated (last resort)
                        case "${DbSslMode}" in
                          Require)
                            export PGSSLMODE=require
                            db_ssl='SSL Mode=Require'
                            ;;
                          VerifyFullSystemCa)
                            export PGSSLMODE=verify-full PGSSLROOTCERT=system
                            db_ssl='SSL Mode=VerifyFull'
                            ;;
                          *)
                            require_rds_ca
                            export PGSSLMODE=verify-full PGSSLROOTCERT="$host_ca"
                            db_ssl="SSL Mode=VerifyFull;Root Certificate=$ctr_ca"
                            ;;
                        esac
                        # A carve failure names the knob and the likely cause, then fails the boot fast.
                        carve_failed() {
                          fatal "ExistingServer carve could not connect to ${DbServerHost}:${DbServerPort} or run its SQL (DbSslMode=${DbSslMode}, psql sslmode=$PGSSLMODE; the psql error is above). If it is a hostname mismatch (DbServerHost is an IP or your own CNAME/alias the certificate does not name): set DbServerHost to the name the certificate covers (the endpoint exactly as AWS shows it) -- VerifyFullSystemCa checks the hostname too and will not help. If it is an untrusted CA (the server is not RDS/Aurora): DbSslMode=VerifyFullSystemCa for a publicly trusted certificate (for example RDS Proxy; needs libpq 16+, i.e. the default Ubuntu 24.04 UbuntuAmi -- an older AMI override fails closed with 'root certificate file system does not exist'). DbSslMode=Require is only for a confirmed limitation you accept: it encrypts without authenticating the server. Otherwise check reachability (DbServerSecurityGroupId, routing) and the admin credentials."
                        }
                        export PGPASSWORD="$admin_pass"
                        psql -v ON_ERROR_STOP=1 -h "${DbServerHost}" -p "${DbServerPort}" -U "${DbAdminUsername}" -d postgres -v brochpw="$broch_pass" <<'SQL' || carve_failed
                    SELECT 'CREATE ROLE broch LOGIN' WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'broch')\gexec
                    ALTER ROLE broch LOGIN PASSWORD :'brochpw';
                    -- Managed Postgres (RDS, Cloud SQL, Azure Flexible Server, ...) runs the
                    -- admin as a NON-superuser member of rds_superuser/azure_pg_admin/etc.
                    -- Creating a database OWNER broch then requires the admin to be a member of
                    -- broch (to SET ROLE to it); without this, RDS fails with "must be able to
                    -- SET ROLE broch". A true superuser admin bypasses the check, so this is a
                    -- harmless no-op there. Idempotent: re-granting an existing membership is fine.
                    GRANT broch TO CURRENT_USER;
                    SELECT 'CREATE DATABASE brochdb OWNER broch' WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'brochdb')\gexec
                    SQL
                        psql -v ON_ERROR_STOP=1 -h "${DbServerHost}" -p "${DbServerPort}" -U "${DbAdminUsername}" -d brochdb <<'SQL' || carve_failed
                    GRANT ALL ON SCHEMA public TO broch;
                    ALTER SCHEMA public OWNER TO broch;
                    SQL
                        unset PGPASSWORD PGSSLMODE PGSSLROOTCERT
                        printf "BROCH_DB_CONNECTION_STRING='Host=${DbServerHost};Port=${DbServerPort};Database=brochdb;Username=broch;Password=%s;%s'\n" "$broch_pass" "$db_ssl" >> "$env_file"
                        ;;
                      Local)
                        # On-box Postgres: the with-postgres compose builds its own connection string
                        # (Host=postgres) from POSTGRES_PASSWORD, so we write only that here -- no
                        # BROCH_DB_CONNECTION_STRING. The compose defaults POSTGRES_DB=brochdb and
                        # POSTGRES_USER=broch. Postgres keeps this password from first data-dir init.
                        put POSTGRES_PASSWORD broch-local-db-password
                        ;;
                    esac

                    if [ "${HasCfToken}" = "true" ]; then
                      put CLOUDFLARE_API_TOKEN broch-cloudflare-token
                    fi
                    if [ "${HasAuthSecret}" = "true" ]; then
                      put AUTHENTICATION__CLIENTSECRET broch-auth-client-secret
                    fi
                    if [ "${IsByo}" = "true" ]; then
                      # base64 PEM -> files. The Byo Caddyfile reads these; the private key is 0600.
                      get "broch-tls-cert" | base64 -d > /opt/broch/certs/fullchain.pem
                      get "broch-tls-key" | base64 -d > /opt/broch/certs/privkey.pem
                      chmod 0644 /opt/broch/certs/fullchain.pem
                      chmod 0600 /opt/broch/certs/privkey.pem
                    fi
                    if [ "${DoTokenSet}" = "true" ]; then
                      put DO_AUTH_TOKEN broch-do-token
                    fi
                    if [ "${GcpCredsSet}" = "true" ]; then
                      # SA JSON read by Caddy via GOOGLE_APPLICATION_CREDENTIALS (set in .env).
                      get "broch-gcp-creds" | base64 -d > /opt/broch/certs/gcp-sa.json
                      chmod 0600 /opt/broch/certs/gcp-sa.json
                    fi
                    if [ "${HasRegistryPw}" = "true" ]; then
                      # --password-stdin via a shell variable: no token ever reaches argv,
                      # and a token containing quotes can't break the command.
                      reg_pass="$(get "broch-registry-password")"
                      printf '%s' "$reg_pass" | docker login "${RegistryServer}" -u "${RegistryUsername}" --password-stdin
                    fi
                    chmod 0600 "$env_file"
                  - DbEndpoint: !If [IsNewServer, !GetAtt BrochDB.Endpoint.Address, ""]
                    HasCfToken: !If [HasCloudflareToken, "true", "false"]
                    HasAuthSecret: !If [HasAuthClientSecret, "true", "false"]
                    HasRegistryPw: !If [HasRegistryPassword, "true", "false"]
                    IsByo: !If [IsByoCert, "true", "false"]
                    DoTokenSet: !If [HasDoToken, "true", "false"]
                    GcpCredsSet: !If [HasGcpCreds, "true", "false"]
                    # The stack incarnation UUID — MUST be the same expression the secret Names use.
                    StackSalt: !Select [2, !Split ["/", !Ref "AWS::StackId"]]
    Properties:
      ImageId: !Ref UbuntuAmi
      InstanceType: !Ref InstanceType
      SubnetId: !Ref InstanceSubnetId
      SecurityGroupIds: [!Ref InstanceSecurityGroup]
      IamInstanceProfile: !Ref InstanceProfile
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs: { VolumeSize: 30, VolumeType: gp3, Encrypted: true }
      # DatabaseMode=Local: attach the dedicated on-box Postgres data volume AT LAUNCH (so it is
      # present in UserData before Docker installs — a separate AWS::EC2::VolumeAttachment has no
      # guaranteed ordering against first boot, and under the documented CreationPolicy semantics it
      # would wait for the signal, deadlocking the boot-time mount).
      # Requested as /dev/sdf; on nitro instances it surfaces as an NVMe device, resolved by volume-id
      # in UserData. Absent (no attachment) for every other mode. The AWS analog of azure-vm's
      # storageProfile dataDisks union().
      Volumes: !If
        - IsLocal
        - - { VolumeId: !Ref DataVolume, Device: /dev/sdf }
        - !Ref "AWS::NoValue"
      Tags: [{ Key: Name, Value: !Ref AWS::StackName }]
      MetadataOptions:
        HttpEndpoint: enabled
        # IMDSv2 only: a bare GET (no session token) can't read instance credentials
        # or the user-data blob, so SSRF in the app can't trivially harvest the role.
        HttpTokens: required
        # MUST be 2, not the default 1. Caddy runs in a bridge-network container (one
        # extra network hop), and its route53 DNS-01 module authenticates with the
        # instance role via IMDS — at hop limit 1 the token PUT response is dropped
        # inside the container and wildcard issuance never completes. The host-side
        # boot script (which fetches secrets) is only 1 hop and is unaffected either way.
        HttpPutResponseHopLimit: 2
      UserData:
        Fn::Base64:
          Fn::Sub:
            - |
              #cloud-config
              # Broch -- AWS VM appliance bootstrap. Deploys the CANONICAL
              # with-postgres-external + Caddy assets verbatim (base64-embedded by
              # build.sh). Only /opt/broch/.env is templated. Caddy issues the
              # wildcard via ACME DNS-01; with DnsProvider=Route53 it authenticates
              # with THIS instance's IAM role (the .env sets no AWS keys, so Caddy's
              # route53 module falls through to the instance metadata credentials).
              # NOTE: this block must stay pure ASCII -- cloud-init's YAML loader
              # rejects multi-byte UTF-8 in user-data and silently drops the whole config.
              package_update: true
              # python3-pip: for aws-cfn-bootstrap (cfn-init). unzip: for the AWS CLI v2 installer.
              # NOTE: Ubuntu 24.04 ships NO 'awscli' apt package -- AWS CLI v2 is installed in runcmd.
              packages: [ca-certificates, curl, gnupg, python3-pip, unzip]
              write_files:
                # docker-compose.yml, the CertMode-selected Caddyfile, AND render-secrets.sh are
                # written by cfn-init from template metadata (too big for UserData's 25,600-byte cap) --
                # see the Instance Metadata block above. Only the small fragments stay inline below.
                # tls.caddy (Caddy's per-provider TLS fragment) is generated at boot by
                # render-secrets.sh -- it must be multi-line (Caddy rejects single-line blocks)
                # and Route 53 needs a propagation wait, both awkward in a YAML block scalar.
                # Only NON-secret values here. The secrets (master key, DB connection
                # string / password, Cloudflare token, IdP client secret) are appended
                # at boot by render-secrets.sh, fetched from Secrets Manager via the
                # instance role -- they are never written into UserData.
                - path: /opt/broch/.env
                  permissions: "0600"
                  content: |
                    # Single-quoted: compose takes these literally (AllowedPattern refuses what can't be).
                    # BROCH_VERSION is added by /opt/broch/set-version.sh (cfn-init metadata), so a
                    # BrochVersion change is a metadata-only stack update applied in place by cfn-hup.
                    BROCH_IMAGE=${BrochImage}
                    BROCH_WILDCARD_HOSTNAME='${WildcardHostname}'
                    # Seed for broch's public-IP setting (compose maps it to API__PUBLICIP): this stack's
                    # Elastic IP, known here, so broch serves it to caddy-dynamicdns for the apex+wildcard
                    # A records (auto-DNS points at the IP we KNOW, not one caddy discovers), and an admin
                    # can override it at runtime in broch. Non-secret (it's published in DNS anyway).
                    BROCH_PUBLIC_IP='${PublicIpAddr}'
                    CADDY_ACME_EMAIL='${AcmeEmail}'
                    GCP_PROJECT='${GcpProject}'
                    GOOGLE_APPLICATION_CREDENTIALS='${GcpCredsPath}'
                    AUTHENTICATION__PROVIDER='${AuthProvider}'
                    AUTHENTICATION__CLIENTID='${AuthClientId}'
                    AUTHENTICATION__ADMINROLES='${AuthAdminRoles}'
                    AUTHENTICATION__DOMAIN='${AuthDomain}'
                    AUTHENTICATION__TENANTID='${AuthTenantId}'
                    AUTHENTICATION__INSTANCE='${AuthInstance}'
                    AUTHENTICATION__AUTHORITY='${AuthAuthority}'
                    AUTHENTICATION__AUDIENCE='${AuthAudience}'
                - path: /etc/systemd/system/broch.service
                  permissions: "0644"
                  content: |
                    [Unit]
                    Description=Broch (Docker Compose)
                    Requires=docker.service
                    After=docker.service
                    # DatabaseMode=Local: do NOT start the stack until the data volume is mounted, so
                    # Postgres can never initialise an empty database on the ephemeral root disk.
                    # RequiresMountsFor waits for the mount; a Local-only ConditionPathIsMountPoint
                    # drop-in (written by runcmd) additionally refuses to start when nothing is mounted
                    # there. No-op for other modes (resolves to the always-active root mount; no drop-in).
                    RequiresMountsFor=/var/lib/docker/volumes
                    [Service]
                    Type=oneshot
                    RemainAfterExit=yes
                    WorkingDirectory=/opt/broch
                    # --force-recreate --remove-orphans so every boot CONVERGES from any prior state.
                    # After an unclean stop, containers can be left "Created" with a nil RWLayer (overlay2
                    # writable layer never committed); a plain `up -d` tries to start those stale containers,
                    # won't recreate them, and the stack never comes up (a reboot alone can't clear it).
                    # Force-recreate replaces them; named volumes are preserved -- idempotent, no data loss.
                    # ExecStartPre: BROCH_VERSION follows the stack's BrochVersion on every start, so a
                    # hand edit of .env can't leave the box on a version the stack doesn't record.
                    ExecStartPre=/bin/sh /opt/broch/set-version.sh
                    ExecStart=/usr/bin/docker compose up -d --force-recreate --remove-orphans
                    ExecStop=/usr/bin/docker compose down
                    [Install]
                    WantedBy=multi-user.target
              runcmd:
                - |
                  if [ ! -f /swapfile ]; then
                    fallocate -l 2G /swapfile || dd if=/dev/zero of=/swapfile bs=1M count=2048
                    chmod 600 /swapfile; mkswap /swapfile; swapon /swapfile
                    echo '/swapfile none swap sw 0 0' >> /etc/fstab
                  fi
                - chmod 0600 /opt/broch/.env
                # DatabaseMode=Local: attach-at-launch data volume holds the bundled Postgres. Mount it
                # at /var/lib/docker/volumes BEFORE Docker installs, so the postgres_data named volume
                # lives on it and is preserved across instance stop/start + a stack-delete snapshot. Gated on ${DatabaseMode} so it is a true
                # no-op for the other modes, and so a MISSING volume in Local mode FAILS LOUD instead of
                # silently putting the database on the ephemeral root disk. Format ONLY when blank (blkid).
                # Mirrors the azure-vm cloud-init data-disk block. Shell vars are written UNBRACED (bare
                # dollar-name) so Fn::Sub leaves them; only DatabaseMode / DataVolumeId are CFN-substituted.
                #
                # cloud-init concatenates ALL runcmd items into ONE /bin/sh script, so a bare `exit` here
                # would end it before cfn-signal and leave the stack waiting out its whole timeout. The
                # body therefore runs in a SUBSHELL: its `exit 1`s leave only the subshell, and the failure
                # is recorded in /opt/broch/boot-fatal, so broch is not started and the health wait below
                # signals FAILURE at once. (No runcmd item may `exit` or `set -e` for the same reason.)
                - |
                  if [ "${DatabaseMode}" = "Local" ]; then
                   (
                    # Fail-closed guards FIRST -- before anything below can `exit`. The
                    # ConditionPathIsMountPoint drop-in is the load-bearing barrier that keeps broch from
                    # starting against an unmounted (empty) /var/lib/docker/volumes on any REBOOT (runcmd
                    # is first-boot only), so it MUST exist even if volume setup then fails. Local-ONLY:
                    # for other modes the path is a plain root-fs dir, never a mount point, so the
                    # condition would wrongly block broch forever.
                    mkdir -p /etc/systemd/system/broch.service.d
                    printf '[Unit]\nConditionPathIsMountPoint=/var/lib/docker/volumes\n' > /etc/systemd/system/broch.service.d/10-require-data-mount.conf || { echo "FATAL: could not write broch mount guard" >&2; exit 1; }
                    # dockerd must ALSO wait for the mount: on a reboot the fstab `nofail` entry drops the
                    # mount's ordering before local-fs.target, so dockerd (after local-fs.target) could
                    # otherwise realise /var/lib/docker/volumes on the root disk BEFORE the data volume
                    # mounts over it, putting the postgres named volume in the wrong place.
                    mkdir -p /etc/systemd/system/docker.service.d
                    printf '[Unit]\nRequiresMountsFor=/var/lib/docker/volumes\n' > /etc/systemd/system/docker.service.d/10-require-data-mount.conf || { echo "FATAL: could not write docker mount-ordering drop-in" >&2; exit 1; }
                    # Resolve the device by VOLUME ID, never a hardcoded name: on nitro instances an EBS
                    # volume requested as /dev/sdf surfaces as /dev/nvme*n1, with a stable udev by-id
                    # symlink whose serial is the volume id minus its dash (vol-0abc -> vol0abc). Fall back
                    # to /dev/sdf for the rare non-nitro case. Attached at launch, but the device node can
                    # lag a few seconds -- wait, then FAIL LOUD if it never appears.
                    volid='${DataVolumeId}'
                    serial="$(printf '%s' "$volid" | tr -d '-')"
                    byid="/dev/disk/by-id/nvme-Amazon_Elastic_Block_Store_$serial"
                    DEV=""
                    for i in $(seq 1 60); do
                      if [ -e "$byid" ]; then DEV="$byid"; break; fi
                      if [ -e /dev/sdf ]; then DEV=/dev/sdf; break; fi
                      udevadm settle --timeout=30 2>/dev/null || true
                      sleep 2
                    done
                    if [ -z "$DEV" ]; then echo "FATAL: DatabaseMode=Local but the data volume ($volid) never appeared" >&2; exit 1; fi
                    DISK="$(readlink -f "$DEV")"
                    udevadm settle --timeout=30 2>/dev/null || true
                    # blkid rc: 0=filesystem found (KEEP -- a reattached/snapshot-restored volume with
                    # surviving data), 2=blank (first deploy -> mkfs), anything else (4/8/unexpected) ->
                    # ABORT rather than risk `mkfs -F` wiping a populated volume.
                    blkid_rc=0
                    blkid "$DISK" >/dev/null 2>&1 || blkid_rc=$?
                    if [ "$blkid_rc" -eq 2 ]; then mkfs.ext4 -F "$DISK"; elif [ "$blkid_rc" -ne 0 ]; then echo "FATAL: blkid rc $blkid_rc on $DISK -- refusing to format a possibly-populated volume" >&2; exit 1; fi
                    mkdir -p /var/lib/docker/volumes
                    # Poll for the UUID (a freshly-mkfs'd fs's uevent can land after settle's timeout);
                    # FAIL LOUD if still empty so an empty UUID never writes a match-everything fstab line.
                    UUID=""
                    for i in $(seq 1 10); do UUID="$(blkid -s UUID -o value "$DISK")"; [ -n "$UUID" ] && break; udevadm settle --timeout=30 2>/dev/null || true; sleep 2; done
                    if [ -z "$UUID" ]; then echo "FATAL: DatabaseMode=Local but blkid returned no UUID for $DISK after retries" >&2; exit 1; fi
                    # fstab pass field 0: never boot-fsck this optional volume (a `2` can escalate to
                    # emergency.target if it is absent). `nofail` so a missing volume does not wedge boot --
                    # the fail-closed broch.service guard is what actually stops broch from starting blank.
                    grep -q "^UUID=$UUID " /etc/fstab || echo "UUID=$UUID /var/lib/docker/volumes ext4 defaults,nofail 0 0" >> /etc/fstab
                    mountpoint -q /var/lib/docker/volumes || mount /var/lib/docker/volumes || { echo "FATAL: DatabaseMode=Local but mounting the data volume at /var/lib/docker/volumes failed" >&2; exit 1; }
                    # A volume restored from a smaller snapshot (DataVolumeSnapshotId) keeps the snapshot's
                    # filesystem size; grow it online to fill the volume (a no-op otherwise).
                    resize2fs "$DISK" >/dev/null 2>&1 || echo "WARN: resize2fs on $DISK failed; the filesystem keeps its current size" >&2
                   ) || echo "DatabaseMode=Local data volume setup failed -- see FATAL above" >> /opt/broch/boot-fatal
                  fi
                - install -m 0755 -d /etc/apt/keyrings
                - curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
                - chmod a+r /etc/apt/keyrings/docker.asc
                - echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu $(. /etc/os-release && echo $VERSION_CODENAME) stable" > /etc/apt/sources.list.d/docker.list
                - apt-get update
                - apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
                # Write the large static assets (compose + Caddyfile) from template metadata.
                # aws-cfn-bootstrap isn't packaged for Ubuntu; install from the AWS-hosted
                # tarball (--break-system-packages: Ubuntu 24.04 is PEP-668 externally-managed).
                - pip3 install --break-system-packages https://s3.amazonaws.com/cloudformation-examples/aws-cfn-bootstrap-py3-latest.tar.gz
                - /usr/local/bin/cfn-init -v --stack ${AWS::StackName} --resource Instance --region ${AWS::Region}
                # AWS CLI v2 -- Ubuntu 24.04 has NO 'awscli' apt package, and render-secrets needs
                # it to pull secrets from Secrets Manager. Arch-aware: $(uname -m) = aarch64 (t4g) or x86_64.
                - curl -fsSL https://awscli.amazonaws.com/awscli-exe-linux-$(uname -m).zip -o /tmp/awscliv2.zip
                - unzip -q /tmp/awscliv2.zip -d /tmp
                - /tmp/aws/install
                # Wait for CloudFormation's Elastic IP association before anything below talks to a database.
                - sh /opt/broch/wait-eip.sh
                - sh /opt/broch/set-version.sh || echo "set-version.sh failed -- BROCH_VERSION not written to .env" >> /opt/broch/boot-fatal
                # Hydrate secrets into .env (and do any private-registry login) AFTER docker
                # is installed and BEFORE the service starts. ANY non-zero exit (a set -e abort on a
                # secret fetch, apt, a login, ...) leaves .env partial, so it is recorded as a boot FATAL
                # too: broch is then never started and the stack fails at once (see the health wait).
                - |
                  if [ -s /opt/broch/boot-fatal ]; then
                    echo "Skipping secret hydration and database setup: a boot step failed" >&2
                  else
                    bash /opt/broch/render-secrets.sh || echo "render-secrets.sh exited non-zero -- see log above" >> /opt/broch/boot-fatal
                  fi
                - systemctl daemon-reload
                # Apply later BrochVersion stack updates in place (on-version-change.sh).
                - systemctl enable --now cfn-hup.service || echo "WARN - cfn-hup did not start, so BrochVersion stack updates will not reach this instance until it runs"
                # DatabaseMode=Local first-boot guard (belt-and-suspenders for the ConditionPathIsMountPoint
                # drop-in, which gates reboots): refuse to START broch unless the data volume is mounted. If
                # unmounted, do NOT enable broch -- the health wait below then finds no healthy container and
                # cfn-signals failure, rolling the stack back fast instead of initialising Postgres on the
                # ephemeral root disk. Never exits non-zero, so cfn-signal still runs. No-op for other modes.
                - |
                  if [ "${DatabaseMode}" = "Local" ] && ! mountpoint -q /var/lib/docker/volumes; then
                    echo "FATAL: DatabaseMode=Local but /var/lib/docker/volumes is not mounted -- NOT starting broch (would initialise Postgres on the root disk)" >&2
                    echo "DatabaseMode=Local data volume not mounted at /var/lib/docker/volumes" >> /opt/broch/boot-fatal
                  elif [ -s /opt/broch/boot-fatal ]; then
                    echo "NOT starting broch: a boot step recorded a FATAL error (/opt/broch/boot-fatal)" >&2
                  else
                    systemctl enable --now broch.service
                  fi
                # Gate CREATE_COMPLETE on real boot health: wait (bounded) for the broch container
                # to report healthy, then cfn-signal that exit code to the Instance CreationPolicy.
                # A failed/never-healthy boot signals non-zero -> the stack rolls back instead of
                # falsely reporting success. rc/i/cid/h are shell vars referenced unbraced ($rc ...)
                # so Fn::Sub leaves them; only the AWS::StackName / AWS::Region pseudo-params (the
                # only brace-wrapped tokens below) are substituted. A FATAL recorded by render-secrets.sh
                # in /opt/broch/boot-fatal (e.g. database TLS verification) signals failure at once,
                # skipping the wait; the reason is in the instance console / cloud-init output log.
                - |
                  rc=1
                  if [ -s /opt/broch/boot-fatal ]; then
                    echo "boot FATAL (see above): $(cat /opt/broch/boot-fatal)" >&2
                  else
                  for i in $(seq 1 60); do
                    cid=$(docker ps --filter "label=com.docker.compose.service=broch" -q | head -n1)
                    if [ -n "$cid" ]; then
                      h=$(docker inspect -f '{{.State.Health.Status}}' "$cid" 2>/dev/null || echo none)
                      [ "$h" = healthy ] && { rc=0; break; }
                    fi
                    sleep 10
                  done
                  fi
                  /usr/local/bin/cfn-signal --exit-code $rc --stack ${AWS::StackName} --resource Instance --region ${AWS::Region}
            # Condition-derived values the remaining UserData needs. render-secrets.sh (which
            # consumed the DbEndpoint / Has* / Is* values) now lives in cfn-init metadata with
            # its own Fn::Sub map — see the Instance Metadata block. Unused map entries are a
            # CloudFormation validation error, so this map carries exactly what UserData uses.
            # DatabaseMode=Local: the attached data volume's id, used in runcmd to resolve its nitro
            # NVMe device by serial (the volume id minus its dash). Empty for the other modes.
            - DataVolumeId: !If [IsLocal, !Ref DataVolume, ""]
              # The Elastic IP in use: the stack's, or the one ElasticIpAllocationId brought.
              PublicIpAddr: !If [CreateElasticIp, !Ref ElasticIp, !Ref ElasticIpAddress]
              # The ONE public hostname, composed from the zone + share subdomain (apex when the
              # subdomain is empty). Fanned out to Caddy + broch via BROCH_WILDCARD_HOSTNAME in .env.
              WildcardHostname: !If [HasShareSubdomain, !Sub "${ShareSubdomain}.${DnsZone}", !Ref DnsZone]
              # In-container path Caddy reads the GCP SA JSON from (GoogleCloudDns only).
              GcpCredsPath: !If [UseGoogleDns, "/etc/caddy/certs/gcp-sa.json", ""]

Outputs:
  Url:
    Description: Broch URL (sign in here once Caddy has issued the cert).
    Value: !If [HasShareSubdomain, !Sub "https://${ShareSubdomain}.${DnsZone}", !Sub "https://${DnsZone}"]
  PublicIp:
    Description: Elastic IP. With DnsAutoRecords=Auto (the default) the apex/wildcard A records point here automatically (native records on Route53, caddy-dynamicdns on Cloudflare / DigitalOcean / GoogleCloudDns); with DnsAutoRecords=Manual or CertMode=Byo, point both records here yourself.
    Value: !If [CreateElasticIp, !Ref ElasticIp, !Ref ElasticIpAddress]
  DnsHint:
    Description: The apex + wildcard A records to create when you own the records (DnsAutoRecords=Manual, or CertMode=Byo). No-op when DnsAutoRecords=Auto creates them for you.
    Value: !If
      - HasShareSubdomain
      - !Sub
        - "Create A records: ${ShareSubdomain}.${DnsZone} and *.${ShareSubdomain}.${DnsZone} -> ${Addr} (DNS-only / grey-cloud on Cloudflare)"
        - Addr: !If [CreateElasticIp, !Ref ElasticIp, !Ref ElasticIpAddress]
      - !Sub
        - "Create A records: ${DnsZone} and *.${DnsZone} -> ${Addr} (DNS-only / grey-cloud on Cloudflare)"
        - Addr: !If [CreateElasticIp, !Ref ElasticIp, !Ref ElasticIpAddress]
  Readiness:
    Description: Expected first-boot behavior -- the appliance is warming up, not broken, until this completes.
    Value: !If
      - HasShareSubdomain
      - !Sub "First boot takes ~3-10 minutes: instance provisioning, container pulls, DNS propagation, and Let's Encrypt TLS issuance. https://${ShareSubdomain}.${DnsZone} will not load until this finishes -- this is expected, not a failed deploy. The appliance is ready when https://${ShareSubdomain}.${DnsZone}/healthz returns 200."
      - !Sub "First boot takes ~3-10 minutes: instance provisioning, container pulls, DNS propagation, and Let's Encrypt TLS issuance. https://${DnsZone} will not load until this finishes -- this is expected, not a failed deploy. The appliance is ready when https://${DnsZone}/healthz returns 200."
  MasterKeySecretArn:
    Description: Where your supplied BROCH_MASTER_KEY is stored in your AWS account for the instance to read. Keep the original safe and supply the same value on every redeploy that reuses the database.
    Value: !Ref MasterKeySecret
  DatabaseEndpoint:
    Description: RDS endpoint (NewServer), the existing server host (ExistingServer), on-box note (Local), or external note (ExistingDatabase).
    Value: !If
      - IsNewServer
      - !GetAtt BrochDB.Endpoint.Address
      - !If
        - IsExistingServer
        - !Ref DbServerHost
        - !If [IsLocal, "local (Postgres on this instance, on a dedicated EBS data volume)", "external (you supplied the connection string)"]
  SsmCommand:
    Description: Break-glass / log access (no SSH).
    Value: !Sub "aws ssm start-session --target ${Instance}"
