# Deploy-surface lint — structural redeploy-safety and customer-template invariants
# (the rule list lives in scripts/deploy-lint.py's docstring). Credential-free and
# runnable from any fork.
name: Deploy Lint

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: deploy-lint-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Run deploy lint
        run: ./cloudformation/aws-vm/build.sh
      - name: Check deploy invariants
        run: python3 scripts/deploy-lint.py
